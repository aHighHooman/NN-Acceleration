<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 1152 632" width="1152" height="632" role="img" aria-label="Block diagram: parallel ready/valid ports connect directly to nnAccelerator in one clock domain. The input vector goes through a one-entry input register, a triangular skew, the N by N PE array, result alignment, activation and weighted reduction into resultFifo. A parallel sampleContextFifo carries target, input signs and training enable. Retirement pops both FIFO heads, computes the error sign and sends an update package back to PE(0,0) and through a 2N-1 stage pipe into the resident reduction weights.">
<title>Accelerator architecture</title>
<style>
svg{--paper:#F3F5F3; --panel:#FFFFFF; --ink:#15191C; --ink-2:#48525A; --ink-3:#7A848B;
  --rule:#D5DBD8; --grid:#E5E9E6;
  --data:#2350C8; --data-soft:#DDE5FB; --learn:#CF4F16; --learn-soft:#FCE4D7;
  --store:#56665C; --store-soft:#E3EAE5; --ok:#2F7D4F; --warn:#B7791F;
  --display:"Arial Narrow","Roboto Condensed","Segoe UI",system-ui,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;}
@media (prefers-color-scheme:dark){svg{--paper:#101315; --panel:#171B1E; --ink:#E6E9EB; --ink-2:#AEB7BD; --ink-3:#7D878E;
    --rule:#2C3337; --grid:#20262A;
    --data:#86A6FF; --data-soft:#1B2847; --learn:#FF8F57; --learn-soft:#3A2116;
    --store:#A3B8AA; --store-soft:#1F2824; --ok:#63C28A; --warn:#E3B04B;}}
text{font-family:var(--body);fill:var(--ink);font-size:13px}
.m{font-family:var(--mono);font-size:12px}
.s{font-size:11.5px;fill:var(--ink-2)}
.ms{font-family:var(--mono);font-size:10.5px;fill:var(--ink-2)}
.b{font-weight:600}
.h{font-family:var(--display);font-weight:700;font-size:14px}
.mid{text-anchor:middle}
.end{text-anchor:end}
.muted{fill:var(--ink-3)}
.tdata{fill:var(--data)}
.tlearn{fill:var(--learn)}
.bx{fill:var(--panel);stroke:var(--ink);stroke-width:1.25}
.bx2{fill:var(--paper);stroke:var(--ink-3);stroke-width:1}
.bxd{fill:var(--data-soft);stroke:var(--data);stroke-width:1.25}
.bxl{fill:var(--learn-soft);stroke:var(--learn);stroke-width:1.5}
.bxs{fill:var(--store-soft);stroke:var(--store);stroke-width:1.25}
.frame{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:5 4}
.core{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}
.ld{fill:none;stroke:var(--data);stroke-width:2}
.ll{fill:none;stroke:var(--learn);stroke-width:2.25}
.ls{fill:none;stroke:var(--store);stroke-width:1.75}
.lk{fill:none;stroke:var(--ink-2);stroke-width:1.5}
.lg{fill:none;stroke:var(--grid);stroke-width:1}
.lr{fill:none;stroke:var(--rule);stroke-width:1}
.dash{stroke-dasharray:4 4}
.halo{fill:none;stroke:var(--panel);stroke-width:9}
.fd{fill:var(--data)} .fl{fill:var(--learn)} .fs{fill:var(--store)} .fk{fill:var(--ink-2)}
.fsoftd{fill:var(--data-soft)} .fsoftl{fill:var(--learn-soft)} .fsofts{fill:var(--store-soft)}
.fp{fill:var(--panel)} .fpp{fill:var(--paper)}
.ghost{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 2}
</style>
<rect x="-15.5" y="-15.5" width="1151" height="631" rx="10" style="fill:var(--panel);stroke:var(--rule)"/>
<defs>
        <marker id="f1d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fd"/></marker>
        <marker id="f1l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fl"/></marker>
        <marker id="f1s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fs"/></marker>
      </defs>
      <text x="20" y="24" class="m muted">Parallel interface · one clock domain · default N = 3</text>
      <!-- public inputs -->
      <rect x="20" y="90" width="160" height="40" rx="4" class="bx2"/>
      <text x="100" y="107" class="mid b">matrix row</text><text x="100" y="122" class="mid ms">weightValid / weightReady</text>
      <rect x="20" y="226" width="160" height="40" rx="4" class="bx2"/>
      <text x="100" y="243" class="mid b">inputData[N]</text><text x="100" y="258" class="mid ms">inputValid / inputReady</text>
      <rect x="20" y="520" width="160" height="40" rx="4" class="bxs"/>
      <text x="100" y="537" class="mid m">targetData</text><text x="100" y="552" class="mid m">trainingEnable</text>
      <line x1="180" y1="540" x2="208" y2="540" class="ls" marker-end="url(#f1s)"/>
      <!-- public output -->
      <rect x="944" y="236" width="160" height="40" rx="4" class="bx2"/>
      <text x="1024" y="253" class="mid b">resultData[N]</text><text x="1024" y="268" class="mid ms">resultValid / resultReady</text>
      <!-- core -->
      <rect x="196" y="44" width="736" height="532" rx="8" class="core"/>
      <text x="212" y="70" class="h">nnAccelerator</text><text x="318" y="70" class="ms">clk domain</text>
      <!-- weight path -->
      <line x1="180" y1="110" x2="428" y2="110" class="ld" marker-end="url(#f1d)"/>
      <text x="300" y="102" class="mid ms">weightData[N]</text>
      <rect x="430" y="93" width="172" height="34" rx="4" class="bxd"/>
      <text x="516" y="115" class="mid">pending weight row</text>
      <line x1="540" y1="127" x2="540" y2="148" class="ld" marker-end="url(#f1d)"/>
      <!-- learning bus (drawn over weight arrow with halo = bridge) -->
      <polyline points="845,150 845,137 456,137" class="halo"/>
      <polyline points="845,150 845,137 456,137 456,160" class="ll" marker-end="url(#f1l)"/>
      <text x="624" y="131" class="s tlearn">update → PE(0,0), then ↘ one diagonal per clk</text>
      <!-- array -->
      <rect x="420" y="150" width="192" height="192" rx="6" class="bx2"/>
      <g class="m">
        <rect x="432" y="162" width="48" height="48" rx="4" class="bx"/><rect x="492" y="162" width="48" height="48" rx="4" class="bx"/><rect x="552" y="162" width="48" height="48" rx="4" class="bx"/>
        <rect x="432" y="222" width="48" height="48" rx="4" class="bx"/><rect x="492" y="222" width="48" height="48" rx="4" class="bx"/><rect x="552" y="222" width="48" height="48" rx="4" class="bx"/>
        <rect x="432" y="282" width="48" height="48" rx="4" class="bx"/><rect x="492" y="282" width="48" height="48" rx="4" class="bx"/><rect x="552" y="282" width="48" height="48" rx="4" class="bx"/>
        <rect x="429" y="159" width="54" height="54" rx="6" style="fill:none;stroke:var(--learn);stroke-width:2"/>
      </g>
      <text x="456" y="190" class="mid m">w00</text><text x="516" y="190" class="mid m">w01</text><text x="576" y="190" class="mid m">w02</text>
      <text x="456" y="250" class="mid m">w10</text><text x="516" y="250" class="mid m">w11</text><text x="576" y="250" class="mid m">w12</text>
      <text x="456" y="310" class="mid m">w20</text><text x="516" y="310" class="mid m">w21</text><text x="576" y="310" class="mid m">w22</text>
      <text x="516" y="358" class="mid ms">partial sums ↓</text>
      <!-- input path -->
      <line x1="180" y1="246" x2="226" y2="246" class="ld" marker-end="url(#f1d)"/>
      <circle cx="210" cy="246" r="3.5" class="fs"/>
      <rect x="228" y="228" width="62" height="36" rx="4" class="bxd"/>
      <text x="259" y="243" class="mid">input</text><text x="259" y="257" class="mid ms">register</text>
      <polyline points="290,246 316,246" class="ld"/>
      <polyline points="316,186 316,306" class="ld"/>
      <line x1="316" y1="186" x2="386" y2="186" class="ld"/>
      <line x1="316" y1="246" x2="368" y2="246" class="ld"/>
      <line x1="316" y1="306" x2="350" y2="306" class="ld"/>
      <g class="bxd">
        <rect x="386" y="179" width="14" height="14"/>
        <rect x="368" y="239" width="14" height="14"/><rect x="386" y="239" width="14" height="14"/>
        <rect x="350" y="299" width="14" height="14"/><rect x="368" y="299" width="14" height="14"/><rect x="386" y="299" width="14" height="14"/>
      </g>
      <line x1="400" y1="186" x2="430" y2="186" class="ld" marker-end="url(#f1d)"/>
      <line x1="400" y1="246" x2="430" y2="246" class="ld" marker-end="url(#f1d)"/>
      <line x1="400" y1="306" x2="430" y2="306" class="ld" marker-end="url(#f1d)"/>
      <text x="360" y="336" class="mid ms">skew: lane i</text><text x="360" y="349" class="mid ms">waits i clk</text>
      <!-- below array -->
      <line x1="516" y1="342" x2="516" y2="344" class="ld"/>
      <rect x="420" y="366" width="192" height="34" rx="4" class="bxd"/>
      <text x="516" y="388" class="mid">align · col j waits N−1−j</text>
      <line x1="456" y1="342" x2="456" y2="364" class="ld" marker-end="url(#f1d)"/>
      <line x1="576" y1="342" x2="576" y2="364" class="ld" marker-end="url(#f1d)"/>
      <line x1="516" y1="400" x2="516" y2="418" class="ld" marker-end="url(#f1d)"/>
      <rect x="420" y="420" width="192" height="34" rx="4" class="bxd"/>
      <text x="516" y="442" class="mid">activation · ReLU or pass</text>
      <line x1="612" y1="437" x2="642" y2="437" class="ld" marker-end="url(#f1d)"/>
      <rect x="644" y="420" width="112" height="34" rx="4" class="bxd"/>
      <text x="700" y="442" class="mid m">Σ rⱼ·aⱼ ≫ 11</text>
      <rect x="644" y="366" width="112" height="34" rx="4" class="bx"/>
      <text x="700" y="388" class="mid">resident R</text>
      <line x1="700" y1="400" x2="700" y2="418" class="lk" marker-end="url(#f1s)"/>
      <rect x="644" y="300" width="112" height="36" rx="4" class="bxl"/>
      <text x="700" y="316" class="mid">Δr pipe</text><text x="700" y="330" class="mid ms">2N−1 advances</text>
      <line x1="700" y1="336" x2="700" y2="364" class="ll" marker-end="url(#f1l)"/>
      <polyline points="780,180 700,180 700,298" class="ll" marker-end="url(#f1l)"/>
      <!-- result fifo -->
      <line x1="756" y1="437" x2="778" y2="437" class="ld" marker-end="url(#f1d)"/>
      <rect x="780" y="330" width="130" height="122" rx="4" class="bxs"/>
      <text x="845" y="349" class="mid b">resultFifo</text>
      <g class="fsoftd" style="stroke:var(--store);stroke-width:1">
        <rect x="792" y="358" width="106" height="11" rx="2"/><rect x="792" y="373" width="106" height="11" rx="2"/><rect x="792" y="388" width="106" height="11" rx="2"/>
      </g>
      <g class="fp" style="stroke:var(--store);stroke-width:1">
        <rect x="792" y="403" width="106" height="11" rx="2"/><rect x="792" y="418" width="106" height="11" rx="2"/><rect x="792" y="433" width="106" height="11" rx="2"/>
      </g>
      <text x="845" y="472" class="mid ms">2N × {a, ŷ, sign r}</text>
      <line x1="845" y1="330" x2="845" y2="286" class="ls" marker-end="url(#f1s)"/>
      <text x="852" y="312" class="ms">head</text>
      <!-- retire -->
      <rect x="780" y="228" width="130" height="56" rx="4" class="bx"/>
      <text x="845" y="251" class="mid h">retire</text><text x="845" y="270" class="mid s">pop both heads</text>
      <line x1="910" y1="256" x2="942" y2="256" class="ld" marker-end="url(#f1d)"/>
      <line x1="845" y1="228" x2="845" y2="194" class="ll" marker-end="url(#f1l)"/>
      <rect x="780" y="150" width="130" height="42" rx="4" class="bxl"/>
      <text x="845" y="176" class="mid m">e = sign(t − ŷ)</text>
      <!-- sample context -->
      <polyline points="210,246 210,540 418,540" class="ls" marker-end="url(#f1s)"/>
      <rect x="420" y="520" width="300" height="40" rx="4" class="bxs"/>
      <text x="432" y="537" class="b">sampleContextFifo</text>
      <text x="432" y="552" class="ms">2N+2 × {t, sign x, train}</text>
      <g class="fsofts" style="stroke:var(--store);stroke-width:1">
        <rect x="604" y="527" width="11" height="26" rx="2"/><rect x="618" y="527" width="11" height="26" rx="2"/><rect x="632" y="527" width="11" height="26" rx="2"/><rect x="646" y="527" width="11" height="26" rx="2"/>
        <rect x="660" y="527" width="11" height="26" rx="2"/><rect x="674" y="527" width="11" height="26" rx="2"/><rect x="688" y="527" width="11" height="26" rx="2"/><rect x="702" y="527" width="11" height="26" rx="2"/>
      </g>
      <polyline points="720,540 922,540 922,272 912,272" class="ls" marker-end="url(#f1s)"/>
      <text x="820" y="532" class="mid ms">context head</text>
      <text x="228" y="511" class="ms">push on accept (inputValid ∧ inputReady)</text>
</svg>
