<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1290" width="1700" height="1290" role="img" aria-labelledby="title desc">
<title id="title">nnAccelerator architecture — three-layer Fountain</title>
<desc id="desc">RTL architecture at N=3, LAYERS=3, WIDTH=16, F=4, G=0, J=1. Host weight rows are staged for all three layers, then written one row per clock into the resident PEs before a single commit. A one-entry input register feeds a source skew with lane delays one, zero, one. In each stage activations enter the center column and move outward horizontally; partial sums start at two seed rows and move outward vertically; a registered join adds the upper and lower boundary sums of each column, then ReLU or pass-through is applied. The staggered lanes chain directly into stages two and three. A final collector aligns the vector at edge ten; one weighted readout forms the scalar prediction and the result FIFO holds the activated vector, prediction and tag. A single pending training sample blocks admission; at its retirement the training engine computes the error sign, serial backward sensitivities and one atomic saturating sign update of every matrix and readout weight.</desc>
