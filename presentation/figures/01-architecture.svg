<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" width="1120" height="430" role="img" aria-label="Corner-fed accelerator: forward data and learning"><title>Corner-fed accelerator: forward data and learning</title><style>
svg{--paper:#F3F5F3; --panel:#FFFFFF; --ink:#15191C; --ink-2:#48525A; --ink-3:#7A848B;
  --rule:#D5DBD8; --grid:#E5E9E6;
  --data:#2350C8; --data-soft:#DDE5FB; --learn:#CF4F16; --learn-soft:#FCE4D7;
  --store:#56665C; --store-soft:#E3EAE5; --ok:#2F7D4F; --warn:#B7791F;
  --display:"Arial Narrow","Roboto Condensed","Segoe UI",system-ui,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;}
@media (prefers-color-scheme:dark){svg{--paper:#101315; --panel:#171B1E; --ink:#E6E9EB; --ink-2:#AEB7BD; --ink-3:#7D878E;
    --rule:#2C3337; --grid:#20262A;
    --data:#86A6FF; --data-soft:#1B2847; --learn:#FF8F57; --learn-soft:#3A2116;
    --store:#A3B8AA; --store-soft:#1F2824; --ok:#63C28A; --warn:#E3B04B;}}
text{font-family:var(--body);fill:var(--ink);font-size:13px}
.m{font-family:var(--mono);font-size:12px}
.s{font-size:11.5px;fill:var(--ink-2)}
.ms{font-family:var(--mono);font-size:10.5px;fill:var(--ink-2)}
.b{font-weight:600}
.h{font-family:var(--display);font-weight:700;font-size:14px}
.mid{text-anchor:middle}
.end{text-anchor:end}
.muted{fill:var(--ink-3)}
.tdata{fill:var(--data)}
.tlearn{fill:var(--learn)}
.bx{fill:var(--panel);stroke:var(--ink);stroke-width:1.25}
.bx2{fill:var(--paper);stroke:var(--ink-3);stroke-width:1}
.bxd{fill:var(--data-soft);stroke:var(--data);stroke-width:1.25}
.bxl{fill:var(--learn-soft);stroke:var(--learn);stroke-width:1.5}
.bxs{fill:var(--store-soft);stroke:var(--store);stroke-width:1.25}
.frame{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:5 4}
.core{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}
.ld{fill:none;stroke:var(--data);stroke-width:2}
.ll{fill:none;stroke:var(--learn);stroke-width:2.25}
.ls{fill:none;stroke:var(--store);stroke-width:1.75}
.lk{fill:none;stroke:var(--ink-2);stroke-width:1.5}
.lg{fill:none;stroke:var(--grid);stroke-width:1}
.lr{fill:none;stroke:var(--rule);stroke-width:1}
.dash{stroke-dasharray:4 4}
.halo{fill:none;stroke:var(--panel);stroke-width:9}
.fd{fill:var(--data)} .fl{fill:var(--learn)} .fs{fill:var(--store)} .fk{fill:var(--ink-2)}
.fsoftd{fill:var(--data-soft)} .fsoftl{fill:var(--learn-soft)} .fsofts{fill:var(--store-soft)}
.fp{fill:var(--panel)} .fpp{fill:var(--paper)}
.ghost{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 2}
</style><rect x="1" y="1" width="1118" height="428" rx="10" style="fill:var(--panel);stroke:var(--rule)"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink-2)"/></marker></defs><text x="26" y="32" class="h">Corner-fed accelerator: forward data and learning</text><rect x="20" y="120" width="160" height="90" rx="6" class="bxd"/><text x="100.0" y="146" class="mid b">Input register</text><text x="100.0" y="168" class="mid s">1 complete vector</text><path d="M180,165 L201,165" class="ld" marker-end="url(#arrow)"/><rect x="202" y="120" width="160" height="90" rx="6" class="bxd"/><text x="282.0" y="146" class="mid b">Shared skew</text><text x="282.0" y="168" class="mid s">Left / right taps</text><path d="M362,165 L383,165" class="ld" marker-end="url(#arrow)"/><rect x="384" y="120" width="160" height="90" rx="6" class="bxd"/><text x="464.0" y="146" class="mid b">Inward array</text><text x="464.0" y="168" class="mid s">AD MAC registers</text><path d="M544,165 L565,165" class="ld" marker-end="url(#arrow)"/><rect x="566" y="120" width="160" height="90" rx="6" class="bxd"/><text x="646.0" y="146" class="mid b">Activation + sum</text><text x="646.0" y="168" class="mid s">Vector + prediction</text><path d="M726,165 L747,165" class="ld" marker-end="url(#arrow)"/><rect x="748" y="120" width="160" height="90" rx="6" class="bxd"/><text x="828.0" y="146" class="mid b">resultFifo</text><text x="828.0" y="168" class="mid s">Saved reduction signs</text><path d="M908,165 L929,165" class="ld" marker-end="url(#arrow)"/><rect x="930" y="120" width="160" height="90" rx="6" class="bxd"/><text x="1010.0" y="146" class="mid b">Retirement</text><text x="1010.0" y="168" class="mid s">Paired FIFO heads</text><rect x="380" y="50" width="340" height="50" rx="6" class="bxs"/><text x="550.0" y="76" class="mid b">Weight bank -&gt; N shifts -&gt; capture</text><rect x="200" y="260" width="340" height="65" rx="6" class="bxs"/><text x="370.0" y="286" class="mid b">sampleContextFifo</text><text x="370.0" y="308" class="mid s">Target, input signs, training bit</text><path d="M100,210 L100,292" class="ls" marker-end="url(#arrow)"/><path d="M100,292 L200,292" class="ls" marker-end="url(#arrow)"/><path d="M540,292 L1010,292" class="ls" marker-end="url(#arrow)"/><path d="M1010,292 L1010,210" class="ls" marker-end="url(#arrow)"/><rect x="560" y="345" width="520" height="60" rx="6" class="bxl"/><text x="820.0" y="371" class="mid b">Learning: inward W updates and N-stage R update pipe</text><path d="M1010,325 L1010,345" class="ll" marker-end="url(#arrow)"/><path d="M460,100 L460,120" class="ls" marker-end="url(#arrow)"/><path d="M560,375 L464,375 L464,210" class="ll" marker-end="url(#arrow)"/><text x="25" y="387" class="s">One accepted vector feeds both boundaries.</text></svg>