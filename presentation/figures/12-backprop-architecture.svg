<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1195" width="1600" height="1195" role="img" aria-labelledby="title desc">
<title id="title">Fountain backpropagation path — capture, serial sensitivities, atomic sign update</title>
<desc id="desc">A training sample runs through the normal forward pipeline while taps after each matrix stage record the ReLU gate and the sign of each activated output; the input signs are latched at admission. When the training result is popped from the result FIFO, the training engine compares the saved target with the prediction to form sign(e) and seeds the last-layer sensitivity with the gated readout coefficients. In the BACKWARD state one shared multiply-accumulate unit reads the resident PE weights in place and computes s[l][row] = g[l][row] times the sum over columns of W[l+1][row][col] times s[l+1][col], one product per advancing cycle, for (LAYERS-1)*N*N cycles. In the one-cycle APPLY state each layer receives N row-direction lanes equal to sign(a[l][i]) and N column-direction lanes equal to sign(e)*sign(s[l][j]); each PE combines its row and column sign with a comparator and steps its weight by one saturating LSB. The readout coefficients update in the same cycle by sign(e)*sign(a[L][j]).</desc>
<style>
svg{--paper:#F3F5F3; --panel:#FFFFFF; --ink:#15191C; --ink-2:#48525A; --ink-3:#7A848B;
  --rule:#D5DBD8; --grid:#E5E9E6;
  --data:#2350C8; --data-soft:#DDE5FB; --learn:#CF4F16; --learn-soft:#FCE4D7;
  --sum:#0B7F72; --store:#56665C; --store-soft:#E3EAE5;
  --display:"Arial Narrow","Roboto Condensed","Segoe UI",system-ui,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;}
@media (prefers-color-scheme:dark){svg{--paper:#101315; --panel:#171B1E; --ink:#E6E9EB; --ink-2:#AEB7BD; --ink-3:#7D878E;
    --rule:#2C3337; --grid:#20262A;
    --data:#86A6FF; --data-soft:#1B2847; --learn:#FF8F57; --learn-soft:#3A2116;
    --sum:#56D4C2; --store:#A3B8AA; --store-soft:#1F2824;}}
text{font-family:var(--body);fill:var(--ink);font-size:15px}
.m{font-family:var(--mono);font-size:14px;white-space:pre}
.s{font-size:13px;fill:var(--ink-2)}
.ms{font-family:var(--mono);font-size:12px;fill:var(--ink-2)}
.b{font-weight:600}
.h{font-family:var(--display);font-weight:700;font-size:17px}
.big{font-size:26px;font-weight:600}
.mid{text-anchor:middle}
.end{text-anchor:end}
.tdata{fill:var(--data)}
.tlearn{fill:var(--learn)}
.tstore{fill:var(--store)}
.bx{fill:var(--panel);stroke:var(--ink);stroke-width:1.25}
.bx2{fill:var(--paper);stroke:var(--ink-3);stroke-width:1}
.bxd{fill:var(--data-soft);stroke:var(--data);stroke-width:1.25}
.bxl{fill:var(--learn-soft);stroke:var(--learn);stroke-width:1.5}
.bxs{fill:var(--store-soft);stroke:var(--store);stroke-width:1.25}
.bxp{fill:var(--panel);stroke:var(--sum);stroke-width:1.5}
.frame{fill:var(--panel);stroke:var(--ink-3);stroke-width:1;stroke-dasharray:5 4}
.framel{fill:var(--panel);stroke:var(--learn);stroke-width:1.25;stroke-dasharray:6 4}
.ld{fill:none;stroke:var(--data);stroke-width:2}
.ll{fill:none;stroke:var(--learn);stroke-width:2}
.ls{fill:none;stroke:var(--store);stroke-width:1.75}
.lp{fill:none;stroke:var(--sum);stroke-width:2}
.lk{fill:none;stroke:var(--ink-2);stroke-width:1.5}
.dash{stroke-dasharray:5 4}
.halo{fill:none;stroke:var(--panel);stroke-width:8}
.fd{fill:var(--data)} .fl{fill:var(--learn)} .fs{fill:var(--store)} .fk{fill:var(--ink-2)} .fp2{fill:var(--sum)}
.pe{fill:var(--panel);stroke:var(--ink-2);stroke-width:1.25}
.pehi{fill:var(--learn-soft);stroke:var(--learn);stroke-width:2}
.wire-label{paint-order:stroke;stroke:var(--panel);stroke-width:5px;stroke-linejoin:round}
</style>
<defs>
<marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fd"/></marker>
<marker id="l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fl"/></marker>
<marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fs"/></marker>
<marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fk"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fp2"/></marker>
</defs>

<rect x="0" y="0" width="1600" height="1195" style="fill:var(--paper)"/>

<!-- Header -->
<text x="40" y="44" class="h" style="font-size:25px">Fountain backpropagation — capture, serial sensitivities, atomic sign update</text>
<text x="40" y="72" class="s">A training sample uses the normal forward pipeline. Afterwards the engine in nnAccelerator.sv computes full sensitivities on one shared MAC and steps every weight by one LSB in a single cycle.</text>
<text x="40" y="94" class="ms">L = LAYERS · a[l] = input to stage l (a[0] = x, a[L] = final activated vector) · g = ReLU gate · s = sensitivity · e = target − prediction</text>
<g transform="translate(1180,94)">
  <line x1="0" y1="-4" x2="28" y2="-4" class="ld"/><text x="34" y="0" class="ms">forward</text>
  <line x1="100" y1="-4" x2="128" y2="-4" class="ll"/><text x="134" y="0" class="ms">learning</text>
  <line x1="208" y1="-4" x2="236" y2="-4" class="ls dash"/><text x="242" y="0" class="ms">stored state</text>
</g>

<!-- ============ Band 1: forward pass ============ -->
<rect x="20" y="114" width="1560" height="236" rx="8" class="frame"/>
<text x="40" y="141" class="h">① Forward pass of the training sample</text>
<text x="1560" y="141" class="s end">same pipelined datapath as inference; taps record what backprop needs</text>

<rect x="40" y="166" width="170" height="78" rx="6" class="bxd"/>
<text x="125" y="196" class="mid b">Input register</text>
<text x="125" y="220" class="ms mid">x, target, trainEn</text>

<rect x="270" y="166" width="230" height="78" rx="6" class="bxd"/>
<text x="385" y="196" class="mid b">Matrix stage 0</text>
<text x="385" y="220" class="s mid">W[0] in PE grid → ReLU</text>

<rect x="560" y="166" width="230" height="78" rx="6" class="bxd"/>
<text x="675" y="196" class="mid b">Matrix stage 1</text>
<text x="675" y="220" class="s mid">W[1] in PE grid → ReLU</text>

<rect x="850" y="166" width="230" height="78" rx="6" class="bxd"/>
<text x="965" y="196" class="mid b">Matrix stage 2</text>
<text x="965" y="220" class="s mid">W[2] in PE grid → ReLU</text>

<rect x="1140" y="166" width="190" height="78" rx="6" class="bxd"/>
<text x="1235" y="196" class="mid b">Weighted readout</text>
<text x="1235" y="220" class="ms mid">Σ a[L][j]·r[j]</text>

<rect x="1390" y="166" width="170" height="78" rx="6" class="bxd"/>
<text x="1475" y="196" class="mid b">Result FIFO</text>
<text x="1475" y="220" class="s mid">vector + prediction</text>

<path d="M210,205 H268" class="ld" marker-end="url(#d)"/><text x="239" y="196" class="ms mid tdata">a[0]</text>
<path d="M500,205 H558" class="ld" marker-end="url(#d)"/><text x="529" y="196" class="ms mid tdata">a[1]</text>
<path d="M790,205 H848" class="ld" marker-end="url(#d)"/><text x="819" y="196" class="ms mid tdata">a[2]</text>
<path d="M1080,205 H1138" class="ld" marker-end="url(#d)"/><text x="1109" y="196" class="ms mid tdata">a[L]</text>
<path d="M1330,205 H1388" class="ld" marker-end="url(#d)"/><text x="1359" y="196" class="ms mid tdata">ŷ</text>

<!-- weight read-in-place (store) -->
<path d="M760,244 V338 H585 V418" class="halo"/>
<path d="M760,244 V338 H585 V418" class="ls dash" marker-end="url(#s)"/>
<path d="M1050,244 V338 H760" class="ls dash"/>
<text x="1060" y="300" class="ms tstore">W[1], W[2] read in place</text>
<text x="1060" y="316" class="ms tstore">(residentWeights, no copy)</text>

<!-- taps -->
<circle cx="385" cy="244" r="4" class="fl"/><circle cx="675" cy="244" r="4" class="fl"/><circle cx="965" cy="244" r="4" class="fl"/>
<path d="M385,244 V286" class="ll"/>
<path d="M675,244 V286" class="ll"/>
<path d="M965,244 V286 H232 V418" class="halo"/>
<path d="M965,244 V286 H232 V418" class="ll" marker-end="url(#l)"/>
<text x="377" y="268" class="ms tlearn end">g[0], sgn a[1]</text>
<text x="667" y="268" class="ms tlearn end">g[1], sgn a[2]</text>
<text x="957" y="268" class="ms tlearn end">g[2], sgn a[L]</text>
<text x="246" y="310" class="ms tlearn">tapGate / tapSign, captured on tapValid while trainingPending</text>
<text x="246" y="326" class="ms">(the last value on each lane is the training sample’s)</text>
<circle cx="125" cy="244" r="4" class="fl"/>
<path d="M125,244 V418" class="ll" marker-end="url(#l)"/>
<text x="133" y="268" class="ms tlearn">sgn x</text>
<text x="133" y="284" class="ms">at admission</text>

<!-- prediction to error -->
<path d="M1475,244 V418" class="ld" marker-end="url(#d)"/>
<text x="1483" y="300" class="ms tdata">prediction</text>
<text x="1483" y="316" class="ms">on host pop</text>

<!-- ============ Band 2: training engine ============ -->
<rect x="20" y="364" width="1560" height="440" rx="8" class="framel"/>
<text x="40" y="391" class="h tlearn">② Training engine — nnAccelerator.sv</text>
<text x="1560" y="391" class="s end">runs only after the pipeline drains · every step waits for arrayAdvance</text>

<!-- captured state -->
<rect x="40" y="420" width="370" height="364" rx="6" class="bxs"/>
<text x="56" y="446" class="b">Captured forward state</text>
<rect x="56" y="460" width="338" height="62" rx="4" class="bx"/>
<text x="68" y="484" class="m">r[j]  (residentReductionWeight)</text>
<text x="68" y="508" class="s">readout coefficients · seed for s[L−1]</text>
<rect x="56" y="532" width="338" height="62" rx="4" class="bx"/>
<text x="68" y="556" class="m">activationGates[l][j] = g[l][j]</text>
<text x="68" y="580" class="s">raw &gt; 0 under ReLU · always 1 in passThrough</text>
<rect x="56" y="604" width="338" height="62" rx="4" class="bx"/>
<text x="68" y="628" class="m">finalSigns[j] = sgn a[L][j]</text>
<text x="68" y="652" class="s">inputs to the readout update</text>
<rect x="56" y="676" width="338" height="62" rx="4" class="bx"/>
<text x="68" y="700" class="m">inputSigns[l][i] = sgn a[l][i]</text>
<text x="68" y="724" class="s">l=0: x at admission · l≥1: tapSign[l−1]</text>
<text x="56" y="760" class="s">2-bit signs and 1-bit gates only —</text>
<text x="56" y="776" class="s">no activation magnitudes are kept.</text>

<!-- seed path -->
<path d="M394,491 H426 V406 H950 V418" class="halo"/>
<path d="M394,491 H426 V406 H950 V418" class="ll dash" marker-end="url(#l)"/>
<text x="600" y="401" class="ms tlearn">seed at retirement: s[L−1][j] = g[L−1][j] ? r[j] : 0</text>

<!-- resident weights mux -->
<rect x="460" y="420" width="250" height="72" rx="6" class="bxs"/>
<text x="585" y="448" class="mid b">Resident weight mux</text>
<text x="585" y="474" class="m mid">W[l+1][row][col]</text>

<!-- sensitivity registers -->
<rect x="760" y="420" width="380" height="72" rx="6" class="bxl"/>
<text x="950" y="448" class="mid b">Sensitivity registers s[l][j]</text>
<text x="950" y="474" class="ms mid">SENS_WIDTH = RW + (L−1)(WIDTH + ⌈log₂N⌉)</text>

<!-- multiplier -->
<rect x="520" y="530" width="130" height="58" rx="6" class="bx"/>
<text x="585" y="561" class="mid big" dy="4">×</text>
<text x="585" y="582" class="ms mid">LUT, not DSP</text>
<path d="M585,492 V528" class="ls" marker-end="url(#s)"/>
<path d="M800,492 V559 H652" class="ll" marker-end="url(#l)"/>
<text x="808" y="524" class="ms tlearn">s[l+1][col]</text>

<!-- adder + accumulator -->
<rect x="520" y="622" width="130" height="58" rx="6" class="bxp"/>
<text x="585" y="657" class="mid big tsum" dy="2" style="fill:var(--sum)">+</text>
<path d="M585,588 V620" class="lp" marker-end="url(#p)"/>
<text x="594" y="610" class="ms">backwardProduct</text>
<rect x="710" y="622" width="150" height="58" rx="6" class="bxs"/>
<text x="785" y="646" class="mid b">accumulator</text>
<text x="785" y="668" class="ms mid">cleared at col = 0</text>
<path d="M650,638 H708" class="lp" marker-end="url(#p)"/>
<path d="M710,664 H652" class="lp" marker-end="url(#p)"/>

<!-- gate + write back -->
<rect x="900" y="622" width="240" height="58" rx="6" class="bxl"/>
<text x="1020" y="646" class="m mid">g[l][row] ? sum : 0</text>
<text x="1020" y="668" class="ms mid">write s[l][row] at col = N−1</text>
<path d="M585,680 V702 H1020 V682" class="lp" marker-end="url(#p)"/>
<text x="700" y="697" class="ms" style="fill:var(--sum)">backwardSum</text>
<path d="M1020,622 V494" class="ll" marker-end="url(#l)"/>
<text x="1028" y="540" class="ms tlearn">s[l][row]</text>

<!-- counters -->
<rect x="460" y="722" width="680" height="62" rx="6" class="bx2"/>
<text x="476" y="746" class="m">counters: layer L−2 → 0 · row 0 → N−1 · col 0 → N−1</text>
<text x="476" y="770" class="ms">one product per cycle: s[l][row] = g[l][row] · Σcol W[l+1][row][col] · s[l+1][col]</text>

<!-- error sign -->
<rect x="1190" y="420" width="370" height="120" rx="6" class="bxl"/>
<text x="1206" y="446" class="b">Error sign</text>
<text x="1206" y="474" class="m">savedTarget vs prediction</text>
<text x="1206" y="500" class="m">→ learningDirection = sgn e</text>
<text x="1206" y="526" class="s">e = 0 skips BACKWARD; every update is zero</text>

<!-- FSM -->
<rect x="1190" y="560" width="370" height="224" rx="6" class="bx"/>
<text x="1206" y="586" class="b">Training FSM</text>
<rect x="1206" y="604" width="92" height="38" rx="19" class="bx2"/>
<text x="1252" y="628" class="mid ms" style="fill:var(--ink)">IDLE</text>
<rect x="1326" y="604" width="116" height="38" rx="19" class="bxl"/>
<text x="1384" y="628" class="mid ms" style="fill:var(--ink)">BACKWARD</text>
<rect x="1470" y="604" width="76" height="38" rx="19" class="bxl"/>
<text x="1508" y="628" class="mid ms" style="fill:var(--ink)">APPLY</text>
<path d="M1298,623 H1324" class="lk" marker-end="url(#k)"/>
<path d="M1442,623 H1468" class="lk" marker-end="url(#k)"/>
<path d="M1508,642 C1508,676 1252,676 1252,644" class="lk" marker-end="url(#k)"/>
<text x="1206" y="700" class="ms">IDLE→BACKWARD: training result popped, e≠0</text>
<text x="1206" y="720" class="ms">IDLE→APPLY directly if e=0 or L=1</text>
<text x="1206" y="740" class="ms">BACKWARD: (L−1)·N² advancing cycles</text>
<text x="1206" y="760" class="ms">APPLY: one cycle, clears trainingPending</text>

<!-- ============ Band 3: atomic update ============ -->
<rect x="20" y="820" width="1560" height="254" rx="8" class="framel"/>
<text x="40" y="847" class="h tlearn">③ Atomic update — APPLY, one cycle</text>
<path d="M394,707 H426 V812 H650 V868" class="ll" marker-end="url(#l)"/>
<text x="658" y="858" class="ms tlearn">sgn a[l][i]</text>
<path d="M1140,456 H1166 V846 H760 V868" class="ll" marker-end="url(#l)"/>
<text x="1000" y="838" class="ms tlearn">sgn s[l][j], sgn e</text>
<path d="M360,784 V868" class="ll" marker-end="url(#l)"/>
<text x="368" y="840" class="ms tlearn">r, finalSigns, sgn e</text>

<!-- readout update -->
<rect x="40" y="870" width="370" height="184" rx="6" class="bxl"/>
<text x="56" y="896" class="b">Readout coefficients</text>
<text x="56" y="930" class="m">r[j] ← sat(r[j] + sgn e · sgn a[L][j])</text>
<text x="56" y="966" class="s">Held in nnAccelerator, outside the arrays;</text>
<text x="56" y="986" class="s">updated on the same cycle as every matrix weight.</text>
<text x="56" y="1020" class="s">Saturates at the REDUCTION_WEIGHT_WIDTH limits.</text>

<!-- direction lanes -->
<rect x="440" y="870" width="420" height="184" rx="6" class="bxl"/>
<text x="456" y="896" class="b">Direction lanes, per layer l</text>
<text x="456" y="928" class="m">rowDirection[l][i]    = sgn a[l][i]</text>
<text x="456" y="954" class="m">columnDirection[l][j] = sgn e · sgn s[l][j]</text>
<text x="456" y="988" class="s">2N ternary lanes per layer instead of N² update products.</text>
<text x="456" y="1008" class="s">Each PE combines its row and column sign locally, so</text>
<text x="456" y="1028" class="s">ΔW[l][i,j] = sgn a[l][i] · sgn e · sgn s[l][j].</text>

<!-- mini PE grid -->
<g>
  <text x="997" y="868" class="ms mid">N×N array · column lanes j</text>
  <path d="M937,876 V1058 M997,876 V1058 M1057,876 V1058" class="ll" style="stroke-width:1.5"/>
  <path d="M860,922 H1084 M860,982 H1084 M860,1042 H1084" class="lk" style="stroke-width:1.5"/>
  <text x="868" y="914" class="ms">row i</text>
  <rect x="915" y="905" width="44" height="34" rx="4" class="pe"/>
  <rect x="975" y="905" width="44" height="34" rx="4" class="pe"/>
  <rect x="1035" y="905" width="44" height="34" rx="4" class="pe"/>
  <rect x="915" y="965" width="44" height="34" rx="4" class="pe"/>
  <rect x="975" y="965" width="44" height="34" rx="4" class="pehi"/>
  <rect x="1035" y="965" width="44" height="34" rx="4" class="pe"/>
  <rect x="915" y="1025" width="44" height="34" rx="4" class="pe"/>
  <rect x="975" y="1025" width="44" height="34" rx="4" class="pe"/>
  <rect x="1035" y="1025" width="44" height="34" rx="4" class="pe"/>
  <text x="997" y="987" class="ms mid" style="fill:var(--ink)">PE</text>
  <path d="M1090,982 H1188" class="lk dash" marker-end="url(#k)"/>
  </g>

<!-- PE callout -->
<rect x="1190" y="870" width="370" height="184" rx="6" class="bx"/>
<text x="1206" y="896" class="b">Inside each PE (i, j)</text>
<text x="1206" y="926" class="m">dir = 0   if row = 0 or col = 0</text>
<text x="1206" y="948" class="m">    = +1  if row = col</text>
<text x="1206" y="970" class="m">    = −1  otherwise</text>
<text x="1206" y="1002" class="m">w ← sat(w + dir)</text>
<text x="1206" y="1024" class="s">when matrixUpdateValid (APPLY) and advance.</text>
<text x="1206" y="1044" class="s">A sign comparator, no multiplier; holds at ±limit.</text>

<!-- ============ Timeline ============ -->
<text x="40" y="1104" class="h">Training transaction</text>
<text x="1560" y="1104" class="s end">inference stays pipelined; training is one sample at a time</text>
<rect x="40" y="1118" width="230" height="52" rx="6" class="bxd"/>
<text x="155" y="1140" class="mid b">Admit, close admission</text>
<text x="155" y="1160" class="ms mid">trainingPending ← 1</text>
<rect x="280" y="1118" width="330" height="52" rx="6" class="bxd"/>
<text x="445" y="1140" class="mid b">Drain + forward pass</text>
<text x="445" y="1160" class="ms mid">earlier samples, then the training sample</text>
<rect x="620" y="1118" width="230" height="52" rx="6" class="bxl"/>
<text x="735" y="1140" class="mid b">Host pops the result</text>
<text x="735" y="1160" class="ms mid">sgn e, seed s[L−1]</text>
<rect x="860" y="1118" width="380" height="52" rx="6" class="bxl"/>
<text x="1050" y="1140" class="mid b">BACKWARD</text>
<text x="1050" y="1160" class="ms mid">(L−1)·N² cycles — 50 at N=5, L=3</text>
<rect x="1250" y="1118" width="150" height="52" rx="6" class="bxl"/>
<text x="1325" y="1140" class="mid b">APPLY</text>
<text x="1325" y="1160" class="ms mid">1 cycle</text>
<rect x="1410" y="1118" width="150" height="52" rx="6" class="bx2"/>
<text x="1485" y="1140" class="mid b">Resume</text>
<text x="1485" y="1160" class="ms mid">admission reopens</text>
</svg>
