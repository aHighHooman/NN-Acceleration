<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" width="1120" height="430" role="img" aria-labelledby="f09-title f09-desc"><title id="f09-title">Loading, commit, streaming and drained reconfiguration</title><desc id="f09-desc">After reset or an accepted reload, weightsLoaded is low and the loader collects LAYERS times N rows into a staging buffer, writes one PE row per clock, then commits on one edge and raises weightsLoaded. Streaming and training follow. Reload requires a fully drained accelerator; mode and readout-weight changes latch only while quiescent.</desc><style>
svg{--paper:#F3F5F3; --panel:#FFFFFF; --ink:#15191C; --ink-2:#48525A; --ink-3:#7A848B;
  --rule:#D5DBD8; --grid:#E5E9E6;
  --data:#2350C8; --data-soft:#DDE5FB; --learn:#CF4F16; --learn-soft:#FCE4D7;
  --store:#56665C; --store-soft:#E3EAE5; --ok:#2F7D4F; --warn:#B7791F;
  --display:"Arial Narrow","Roboto Condensed","Segoe UI",system-ui,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;}
@media (prefers-color-scheme:dark){svg{--paper:#101315; --panel:#171B1E; --ink:#E6E9EB; --ink-2:#AEB7BD; --ink-3:#7D878E;
    --rule:#2C3337; --grid:#20262A;
    --data:#86A6FF; --data-soft:#1B2847; --learn:#FF8F57; --learn-soft:#3A2116;
    --store:#A3B8AA; --store-soft:#1F2824; --ok:#63C28A; --warn:#E3B04B;}}
text{font-family:var(--body);fill:var(--ink);font-size:13px}
.m{font-family:var(--mono);font-size:12px}
.s{font-size:11.5px;fill:var(--ink-2)}
.ms{font-family:var(--mono);font-size:10.5px;fill:var(--ink-2)}
.b{font-weight:600}
.h{font-family:var(--display);font-weight:700;font-size:14px}
.mid{text-anchor:middle}
.end{text-anchor:end}
.muted{fill:var(--ink-3)}
.tdata{fill:var(--data)}
.tlearn{fill:var(--learn)}
.bx{fill:var(--panel);stroke:var(--ink);stroke-width:1.25}
.bx2{fill:var(--paper);stroke:var(--ink-3);stroke-width:1}
.bxd{fill:var(--data-soft);stroke:var(--data);stroke-width:1.25}
.bxl{fill:var(--learn-soft);stroke:var(--learn);stroke-width:1.5}
.bxs{fill:var(--store-soft);stroke:var(--store);stroke-width:1.25}
.frame{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:5 4}
.core{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}
.ld{fill:none;stroke:var(--data);stroke-width:2}
.ll{fill:none;stroke:var(--learn);stroke-width:2.25}
.ls{fill:none;stroke:var(--store);stroke-width:1.75}
.lk{fill:none;stroke:var(--ink-2);stroke-width:1.5}
.lg{fill:none;stroke:var(--grid);stroke-width:1}
.lr{fill:none;stroke:var(--rule);stroke-width:1}
.dash{stroke-dasharray:4 4}
.halo{fill:none;stroke:var(--panel);stroke-width:9}
.fd{fill:var(--data)} .fl{fill:var(--learn)} .fs{fill:var(--store)} .fk{fill:var(--ink-2)}
.fsoftd{fill:var(--data-soft)} .fsoftl{fill:var(--learn-soft)} .fsofts{fill:var(--store-soft)}
.fp{fill:var(--panel)} .fpp{fill:var(--paper)}
.ghost{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 2}
</style><rect x="1" y="1" width="1118" height="428" rx="10" style="fill:var(--panel);stroke:var(--rule)"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink-2)"/></marker></defs><text x="26" y="32" class="h">Loading, commit, streaming and drained reconfiguration</text><rect x="30" y="90" width="200" height="120" rx="6" class="bxs"/><text x="130.0" y="116" class="mid b">RESET / RELOAD</text><text x="130.0" y="138" class="mid s">weightsLoaded = 0</text><text x="130.0" y="160" class="mid s">weightReady = 1</text><path d="M230,150 L239,150" class="ls" marker-end="url(#arrow)"/><rect x="240" y="90" width="200" height="120" rx="6" class="bxs"/><text x="340.0" y="116" class="mid b">COLLECT</text><text x="340.0" y="138" class="mid s">LAYERS × N rows</text><text x="340.0" y="160" class="mid s">Staging buffer</text><path d="M440,150 L449,150" class="ls" marker-end="url(#arrow)"/><rect x="450" y="90" width="200" height="120" rx="6" class="bxs"/><text x="550.0" y="116" class="mid b">WRITE</text><text x="550.0" y="138" class="mid s">LAYERS × N clocks</text><text x="550.0" y="160" class="mid s">One PE row per clock</text><path d="M650,150 L659,150" class="ls" marker-end="url(#arrow)"/><rect x="660" y="90" width="200" height="120" rx="6" class="bxs"/><text x="760.0" y="116" class="mid b">COMMIT</text><text x="760.0" y="138" class="mid s">One edge</text><text x="760.0" y="160" class="mid s">weightsLoaded = 1</text><path d="M860,150 L869,150" class="ls" marker-end="url(#arrow)"/><rect x="870" y="90" width="200" height="120" rx="6" class="bxd"/><text x="970.0" y="116" class="mid b">STREAM</text><text x="970.0" y="138" class="mid s">Inputs accepted</text><text x="970.0" y="160" class="mid s">Training allowed</text><text x="560" y="258" class="mid b">reloadReady needs no outstanding or pending training sample and an empty pipeline, collector and result FIFO.</text><text x="560" y="293" class="mid s">An accepted reload blocks a simultaneous input; reoffer it after the new commit edge.</text><text x="560" y="323" class="mid s">passThrough, reduceOutput and readout weights latch only while quiescent; busy attempts are ignored.</text><text x="560" y="353" class="mid s">Synchronous reset clears sample, loader, resident-weight and readout-weight state; the staging buffer is not cleared.</text></svg>