<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 1032 382" width="1032" height="382" role="img" aria-label="Worked example. Input signs plus, minus, zero. Error sign plus one. Reduction weight signs plus, minus, plus and ReLU gates 1, 1, 0 give column directions plus, minus, zero. Their outer product is the 3 by 3 matrix update. The reduction update is error sign times activation sign: plus, plus, zero.">
<title>Sign-sign LMS update</title>
<style>
svg{--paper:#F3F5F3; --panel:#FFFFFF; --ink:#15191C; --ink-2:#48525A; --ink-3:#7A848B;
  --rule:#D5DBD8; --grid:#E5E9E6;
  --data:#2350C8; --data-soft:#DDE5FB; --learn:#CF4F16; --learn-soft:#FCE4D7;
  --store:#56665C; --store-soft:#E3EAE5; --ok:#2F7D4F; --warn:#B7791F;
  --display:"Arial Narrow","Roboto Condensed","Segoe UI",system-ui,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;}
@media (prefers-color-scheme:dark){svg{--paper:#101315; --panel:#171B1E; --ink:#E6E9EB; --ink-2:#AEB7BD; --ink-3:#7D878E;
    --rule:#2C3337; --grid:#20262A;
    --data:#86A6FF; --data-soft:#1B2847; --learn:#FF8F57; --learn-soft:#3A2116;
    --store:#A3B8AA; --store-soft:#1F2824; --ok:#63C28A; --warn:#E3B04B;}}
text{font-family:var(--body);fill:var(--ink);font-size:13px}
.m{font-family:var(--mono);font-size:12px}
.s{font-size:11.5px;fill:var(--ink-2)}
.ms{font-family:var(--mono);font-size:10.5px;fill:var(--ink-2)}
.b{font-weight:600}
.h{font-family:var(--display);font-weight:700;font-size:14px}
.mid{text-anchor:middle}
.end{text-anchor:end}
.muted{fill:var(--ink-3)}
.tdata{fill:var(--data)}
.tlearn{fill:var(--learn)}
.bx{fill:var(--panel);stroke:var(--ink);stroke-width:1.25}
.bx2{fill:var(--paper);stroke:var(--ink-3);stroke-width:1}
.bxd{fill:var(--data-soft);stroke:var(--data);stroke-width:1.25}
.bxl{fill:var(--learn-soft);stroke:var(--learn);stroke-width:1.5}
.bxs{fill:var(--store-soft);stroke:var(--store);stroke-width:1.25}
.frame{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:5 4}
.core{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}
.ld{fill:none;stroke:var(--data);stroke-width:2}
.ll{fill:none;stroke:var(--learn);stroke-width:2.25}
.ls{fill:none;stroke:var(--store);stroke-width:1.75}
.lk{fill:none;stroke:var(--ink-2);stroke-width:1.5}
.lg{fill:none;stroke:var(--grid);stroke-width:1}
.lr{fill:none;stroke:var(--rule);stroke-width:1}
.dash{stroke-dasharray:4 4}
.halo{fill:none;stroke:var(--panel);stroke-width:9}
.fd{fill:var(--data)} .fl{fill:var(--learn)} .fs{fill:var(--store)} .fk{fill:var(--ink-2)}
.fsoftd{fill:var(--data-soft)} .fsoftl{fill:var(--learn-soft)} .fsofts{fill:var(--store-soft)}
.fp{fill:var(--panel)} .fpp{fill:var(--paper)}
.ghost{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 2}
</style>
<rect x="-15.5" y="-15.5" width="1031" height="381" rx="10" style="fill:var(--panel);stroke:var(--rule)"/>
<text x="20" y="28" class="h">Matrix update = outer product of two ternary vectors</text>
      <!-- column derivation -->
      <text x="200" y="62" class="end s">sign rⱼ</text>
      <text x="200" y="92" class="end s">gate gⱼ</text>
      <text x="200" y="122" class="end s b">colDir = e·sign r·g</text>
      <g class="m">
        <rect x="222" y="46" width="52" height="24" rx="4" class="bx2"/><text x="248" y="63" class="mid m">+</text>
        <rect x="284" y="46" width="52" height="24" rx="4" class="bx2"/><text x="310" y="63" class="mid m">−</text>
        <rect x="346" y="46" width="52" height="24" rx="4" class="bx2"/><text x="372" y="63" class="mid m">+</text>
        <rect x="222" y="76" width="52" height="24" rx="4" class="bx2"/><text x="248" y="93" class="mid m">1</text>
        <rect x="284" y="76" width="52" height="24" rx="4" class="bx2"/><text x="310" y="93" class="mid m">1</text>
        <rect x="346" y="76" width="52" height="24" rx="4" class="bx2"/><text x="372" y="93" class="mid m">0</text>
        <rect x="222" y="106" width="52" height="24" rx="4" class="bxl"/><text x="248" y="123" class="mid m b">+1</text>
        <rect x="284" y="106" width="52" height="24" rx="4" class="bxl"/><text x="310" y="123" class="mid m b">−1</text>
        <rect x="346" y="106" width="52" height="24" rx="4" class="bx2"/><text x="372" y="123" class="mid m">0</text>
      </g>
      <!-- row dirs -->
      <text x="100" y="170" class="end s b">rowDir</text><text x="100" y="186" class="end s">= sign xᵢ</text>
      <rect x="130" y="148" width="60" height="52" rx="4" class="bxl"/><text x="160" y="179" class="mid m b">+1</text>
      <rect x="130" y="210" width="60" height="52" rx="4" class="bxl"/><text x="160" y="241" class="mid m b">−1</text>
      <rect x="130" y="272" width="60" height="52" rx="4" class="bx2"/><text x="160" y="303" class="mid m">0</text>
      <text x="206" y="244" class="mid m muted">⊗</text>
      <!-- grid -->
      <g>
        <rect x="222" y="148" width="52" height="52" rx="4" class="bxl"/><text x="248" y="179" class="mid m b">+1</text>
        <rect x="284" y="148" width="52" height="52" rx="4" class="bx" style="stroke:var(--learn)"/><text x="310" y="179" class="mid m b tlearn">−1</text>
        <rect x="346" y="148" width="52" height="52" rx="4" class="bx2"/><text x="372" y="179" class="mid m muted">0</text>
        <rect x="222" y="210" width="52" height="52" rx="4" class="bx" style="stroke:var(--learn)"/><text x="248" y="241" class="mid m b tlearn">−1</text>
        <rect x="284" y="210" width="52" height="52" rx="4" class="bxl"/><text x="310" y="241" class="mid m b">+1</text>
        <rect x="346" y="210" width="52" height="52" rx="4" class="bx2"/><text x="372" y="241" class="mid m muted">0</text>
        <rect x="222" y="272" width="52" height="52" rx="4" class="bx2"/><text x="248" y="303" class="mid m muted">0</text>
        <rect x="284" y="272" width="52" height="52" rx="4" class="bx2"/><text x="310" y="303" class="mid m muted">0</text>
        <rect x="346" y="272" width="52" height="52" rx="4" class="bx2"/><text x="372" y="303" class="mid m muted">0</text>
      </g>
      <text x="414" y="232" class="s">ΔWᵢⱼ in LSBs</text>
      <text x="414" y="250" class="ms">(1 LSB = 1/16)</text>
      <!-- divider -->
      <line x1="540" y1="40" x2="540" y2="330" class="lr"/>
      <!-- error + reduction -->
      <text x="570" y="28" class="h">Error sign and reduction update</text>
      <rect x="570" y="46" width="400" height="84" rx="6" class="bx2"/>
      <text x="586" y="70" class="m">x = [2.5, −1.0, 0.0]   r = [0.5, −0.25, 0.75]</text>
      <text x="586" y="92" class="m">a = ReLU(x·W) = [5.25, 0.50, 0.00]</text>
      <text x="586" y="114" class="m">ŷ = 2.50   t = 3.00   <tspan class="tlearn" font-weight="600">e = sign(t − ŷ) = +1</tspan></text>
      <text x="700" y="170" class="end s">sign aⱼ</text>
      <text x="700" y="212" class="end s b">Δrⱼ = e · sign aⱼ</text>
      <g>
        <rect x="720" y="152" width="60" height="28" rx="4" class="bx2"/><text x="750" y="171" class="mid m">+</text>
        <rect x="790" y="152" width="60" height="28" rx="4" class="bx2"/><text x="820" y="171" class="mid m">+</text>
        <rect x="860" y="152" width="60" height="28" rx="4" class="bx2"/><text x="890" y="171" class="mid m">0</text>
        <rect x="720" y="194" width="60" height="28" rx="4" class="bxl"/><text x="750" y="213" class="mid m b">+1</text>
        <rect x="790" y="194" width="60" height="28" rx="4" class="bxl"/><text x="820" y="213" class="mid m b">+1</text>
        <rect x="860" y="194" width="60" height="28" rx="4" class="bx2"/><text x="890" y="213" class="mid m">0</text>
      </g>
      <text x="570" y="262" class="s">1 LSB of r = 1/128 (Q1.7). Under ReLU aⱼ ≥ 0, so Δr only ever follows e.</text>
      <text x="570" y="284" class="s">Inference samples (trainingEnable = 0) still retire normally but emit no package.</text>
      <text x="570" y="306" class="s">The matrix and reduction packages leave together on the retiring handshake.</text>
</svg>
