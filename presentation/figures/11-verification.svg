<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 1032 472" width="1032" height="472" role="img" aria-label="Verification structure. arithmetic.py feeds FunctionalReference and CycleReference, which must agree on the 2N+1 visibility delay. rtl_reference_compare generates stimulus from nine scenarios, runs nnAcceleratorStateTrace_tb in Questa and compares the RTL trace with CycleReference every edge. Separately, a UVM environment drives randomized traffic into nnAccelerator with a driver, two monitors and an ordered scoreboard, and directed benches cover reduction, the matrix core at N=2 to 4 and the update wave.">
<title>Verification strategy</title>
<style>
svg{--paper:#F3F5F3; --panel:#FFFFFF; --ink:#15191C; --ink-2:#48525A; --ink-3:#7A848B;
  --rule:#D5DBD8; --grid:#E5E9E6;
  --data:#2350C8; --data-soft:#DDE5FB; --learn:#CF4F16; --learn-soft:#FCE4D7;
  --store:#56665C; --store-soft:#E3EAE5; --ok:#2F7D4F; --warn:#B7791F;
  --display:"Arial Narrow","Roboto Condensed","Segoe UI",system-ui,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;}
@media (prefers-color-scheme:dark){svg{--paper:#101315; --panel:#171B1E; --ink:#E6E9EB; --ink-2:#AEB7BD; --ink-3:#7D878E;
    --rule:#2C3337; --grid:#20262A;
    --data:#86A6FF; --data-soft:#1B2847; --learn:#FF8F57; --learn-soft:#3A2116;
    --store:#A3B8AA; --store-soft:#1F2824; --ok:#63C28A; --warn:#E3B04B;}}
text{font-family:var(--body);fill:var(--ink);font-size:13px}
.m{font-family:var(--mono);font-size:12px}
.s{font-size:11.5px;fill:var(--ink-2)}
.ms{font-family:var(--mono);font-size:10.5px;fill:var(--ink-2)}
.b{font-weight:600}
.h{font-family:var(--display);font-weight:700;font-size:14px}
.mid{text-anchor:middle}
.end{text-anchor:end}
.muted{fill:var(--ink-3)}
.tdata{fill:var(--data)}
.tlearn{fill:var(--learn)}
.bx{fill:var(--panel);stroke:var(--ink);stroke-width:1.25}
.bx2{fill:var(--paper);stroke:var(--ink-3);stroke-width:1}
.bxd{fill:var(--data-soft);stroke:var(--data);stroke-width:1.25}
.bxl{fill:var(--learn-soft);stroke:var(--learn);stroke-width:1.5}
.bxs{fill:var(--store-soft);stroke:var(--store);stroke-width:1.25}
.frame{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:5 4}
.core{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}
.ld{fill:none;stroke:var(--data);stroke-width:2}
.ll{fill:none;stroke:var(--learn);stroke-width:2.25}
.ls{fill:none;stroke:var(--store);stroke-width:1.75}
.lk{fill:none;stroke:var(--ink-2);stroke-width:1.5}
.lg{fill:none;stroke:var(--grid);stroke-width:1}
.lr{fill:none;stroke:var(--rule);stroke-width:1}
.dash{stroke-dasharray:4 4}
.halo{fill:none;stroke:var(--panel);stroke-width:9}
.fd{fill:var(--data)} .fl{fill:var(--learn)} .fs{fill:var(--store)} .fk{fill:var(--ink-2)}
.fsoftd{fill:var(--data-soft)} .fsoftl{fill:var(--learn-soft)} .fsofts{fill:var(--store-soft)}
.fp{fill:var(--panel)} .fpp{fill:var(--paper)}
.ghost{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 2}
</style>
<rect x="-15.5" y="-15.5" width="1031" height="471" rx="10" style="fill:var(--panel);stroke:var(--rule)"/>
<defs>
        <marker id="f11k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fk"/></marker>
        <marker id="f11d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fd"/></marker>
      </defs>
      <text x="20" y="26" class="eyebrowish ms">PYTHON REFERENCES · reference/</text>
      <text x="370" y="26" class="ms">GOLDEN RTL COMPARISON</text>
      <text x="690" y="26" class="ms">UVM + DIRECTED BENCHES</text>
      <line x1="350" y1="36" x2="350" y2="430" class="lr"/><line x1="670" y1="36" x2="670" y2="430" class="lr"/>
      <!-- python -->
      <rect x="20" y="340" width="310" height="60" rx="6" class="bx"/>
      <text x="175" y="364" class="mid b">arithmetic.py</text><text x="175" y="384" class="mid ms">widths · rescale · saturation · ternary</text>
      <rect x="20" y="200" width="148" height="92" rx="6" class="bx"/>
      <text x="94" y="222" class="mid b">Functional</text><text x="94" y="238" class="mid b">Reference</text>
      <text x="94" y="258" class="mid ms">per sample</text><text x="94" y="274" class="mid ms">closed form 2N+1</text>
      <rect x="182" y="200" width="148" height="92" rx="6" class="bx"/>
      <text x="256" y="222" class="mid b">Cycle</text><text x="256" y="238" class="mid b">Reference</text>
      <text x="256" y="258" class="mid ms">per edge: W, R,</text><text x="256" y="274" class="mid ms">FIFOs, waves</text>
      <line x1="94" y1="340" x2="94" y2="294" class="lk" marker-end="url(#f11k)"/>
      <line x1="256" y1="340" x2="256" y2="294" class="lk" marker-end="url(#f11k)"/>
      <text x="175" y="322" class="mid ms muted">shared numerics</text>
      <path d="M94,198 L94,150 L256,150 L256,198" class="ll"/>
      <rect x="110" y="116" width="130" height="30" rx="15" class="bxl"/><text x="175" y="136" class="mid m b">agree: 2N+1</text>
      <text x="175" y="100" class="mid ms">checked for N = 2, 3, 4</text>
      <text x="20" y="60" class="s">test_arithmetic · test_functional · test_cycle</text>
      <text x="20" y="78" class="ms muted">python -m unittest (step 1 of the regression)</text>
      <!-- golden -->
      <rect x="370" y="50" width="280" height="50" rx="6" class="bx2"/>
      <text x="510" y="71" class="mid b">9 deterministic scenarios</text><text x="510" y="89" class="mid ms">training · bubbles · stalls · reset · reload</text>
      <rect x="370" y="126" width="130" height="40" rx="6" class="bx2"/><text x="435" y="151" class="mid m">stimulus.txt</text>
      <rect x="370" y="192" width="280" height="56" rx="6" class="bxd"/>
      <text x="510" y="215" class="mid b">nnAccelerator RTL</text><text x="510" y="233" class="mid ms">nnAcceleratorStateTrace_tb · Questa</text>
      <rect x="520" y="274" width="130" height="40" rx="6" class="bx2"/><text x="585" y="299" class="mid m">rtl_trace.txt</text>
      <rect x="370" y="340" width="280" height="60" rx="6" class="bx"/>
      <text x="510" y="364" class="mid b">compare every edge</text><text x="510" y="384" class="mid ms">W, R, pending row, FIFO contents</text>
      <line x1="435" y1="100" x2="435" y2="124" class="lk" marker-end="url(#f11k)"/>
      <line x1="435" y1="166" x2="435" y2="190" class="lk" marker-end="url(#f11k)"/>
      <line x1="585" y1="248" x2="585" y2="272" class="lk" marker-end="url(#f11k)"/>
      <line x1="585" y1="314" x2="585" y2="338" class="lk" marker-end="url(#f11k)"/>
      <polyline points="330,262 352,262 352,370 368,370" class="lk" marker-end="url(#f11k)"/>
      <text x="400" y="330" class="ms muted">expected ↘</text>
      <!-- uvm -->
      <rect x="690" y="50" width="130" height="36" rx="6" class="bx2"/><text x="755" y="73" class="mid ms">sequence (seeded)</text>
      <rect x="690" y="106" width="130" height="36" rx="6" class="bx2"/><text x="755" y="129" class="mid ms">driver</text>
      <rect x="690" y="162" width="290" height="44" rx="6" class="bxd"/><text x="835" y="182" class="mid b">nnAccelerator</text><text x="835" y="198" class="mid ms">N = 3, WIDTH = 8</text>
      <rect x="690" y="226" width="136" height="44" rx="6" class="bx2"/><text x="758" y="244" class="mid ms">input monitor</text><text x="758" y="260" class="mid ms">samples + W snapshot</text>
      <rect x="844" y="226" width="136" height="44" rx="6" class="bx2"/><text x="912" y="244" class="mid ms">result monitor</text><text x="912" y="260" class="mid ms">retired results</text>
      <rect x="690" y="290" width="290" height="44" rx="6" class="bx"/><text x="835" y="310" class="mid b">ordered scoreboard</text><text x="835" y="326" class="mid ms">no loss · no dup · reset · inference check</text>
      <line x1="755" y1="86" x2="755" y2="104" class="lk" marker-end="url(#f11k)"/>
      <line x1="755" y1="142" x2="755" y2="160" class="lk" marker-end="url(#f11k)"/>
      <line x1="758" y1="206" x2="758" y2="224" class="lk" marker-end="url(#f11k)"/>
      <line x1="912" y1="206" x2="912" y2="224" class="lk" marker-end="url(#f11k)"/>
      <line x1="758" y1="270" x2="758" y2="288" class="lk" marker-end="url(#f11k)"/>
      <line x1="912" y1="270" x2="912" y2="288" class="lk" marker-end="url(#f11k)"/>
      <text x="690" y="360" class="s b">Directed RTL benches</text>
      <text x="690" y="378" class="ms">weightedVectorReduction_tb · arithmetic</text>
      <text x="690" y="394" class="ms">weightStationaryMatrixMultiplier_tb · N = 2/3/4</text>
      <text x="690" y="410" class="ms">matrixWeightUpdateWave_tb · anti-diagonals</text>
</svg>
