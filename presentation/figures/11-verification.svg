<svg xmlns="http://www.w3.org/2000/svg" class="f11" viewBox="0 0 840 590" width="840" height="590" role="img" aria-labelledby="f11-title f11-description">
<title id="f11-title">Current Fountain verification workflow</title>
<desc id="f11-description">run_modelsim.ps1 runs 25 Python tests, seven directed matrix profiles, PE and readout benches, invalid-parameter checks, and four integrated RTL/reference comparisons. Each integrated profile has 13 directed scenarios; all four total 3545 checked edges. Comparisons cover public handshakes, raw lane fronts, resident weights, readout coefficients and the training barrier. No UVM suite or delayed update-wave bench is part of the current workflow.</desc>
<style>
.f11{--panel:#FFFFFF;--ink:#15191C;--muted:#48525A;--rule:#D5DBD8;--data:#2350C8;--data-soft:#DDE5FB;--learn:#CF4F16;--learn-soft:#FCE4D7}
@media(prefers-color-scheme:dark){.f11{--panel:#171B1E;--ink:#E6E9EB;--muted:#AEB7BD;--rule:#2C3337;--data:#86A6FF;--data-soft:#1B2847;--learn:#FF8F57;--learn-soft:#3A2116}}
.f11 text{font-family:'Segoe UI',Arial,sans-serif;font-size:16px;fill:var(--ink)}
.f11 .title{font-size:22px;font-weight:600}
.f11 .head{font-weight:600}
.f11 .small{font-size:14px;fill:var(--muted)}
.f11 .mono{font-family:'Cascadia Mono',Consolas,monospace;font-size:14px}
.f11 .center{text-anchor:middle}
.f11 .box{fill:var(--data-soft);stroke:var(--data);stroke-width:1}
.f11 .learning{fill:var(--learn-soft);stroke:var(--learn);stroke-width:1}
.f11 .line{stroke:var(--rule);stroke-width:1}
.f11 .arrow{fill:none;stroke:var(--muted);stroke-width:1.5;marker-end:url(#f11-arrow)}
</style>
<defs><marker id="f11-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--muted)"/></marker></defs>
<rect width="840" height="590" style="fill:var(--panel)"/>
<text x="20" y="32" class="title">Fountain verification</text>
<text x="20" y="62" class="mono">Entry point: pwsh -File scripts/run_modelsim.ps1</text>
<text x="20" y="101" class="head">Python references · 25 tests</text>
<text x="300" y="101" class="head">RTL/reference comparisons</text>
<text x="575" y="101" class="head">Directed RTL checks</text>
<rect x="20" y="120" width="245" height="74" rx="6" class="box"/>
<text x="142.5" y="149" class="center mono">arithmetic.py</text>
<text x="142.5" y="175" class="center small">signed widths, shifts, saturation</text>
<rect x="20" y="225" width="245" height="90" rx="6" class="box"/>
<text x="142.5" y="254" class="center">FunctionalReference</text>
<text x="142.5" y="280" class="center small">dense outputs and sensitivities</text>
<text x="142.5" y="302" class="center small">saturated resident updates</text>
<rect x="20" y="345" width="245" height="95" rx="6" class="box"/>
<text x="142.5" y="374" class="center">CycleReference</text>
<text x="142.5" y="400" class="center small">enabled steps, stalls and loading</text>
<text x="142.5" y="423" class="center small">saved context and serial learning</text>
<path d="M142.5 194 V223" class="arrow"/><path d="M142.5 315 V343" class="arrow"/>
<rect x="300" y="120" width="245" height="74" rx="6" class="box"/>
<text x="422.5" y="149" class="center">13 directed scenarios</text>
<text x="422.5" y="175" class="center small">stimulus generated per profile</text>
<rect x="300" y="225" width="245" height="90" rx="6" class="box"/>
<text x="422.5" y="254" class="center">Questa state trace</text>
<text x="422.5" y="280" class="center mono">nnAcceleratorStateTrace_tb</text>
<text x="422.5" y="302" class="center small">the actual RTL, every edge</text>
<rect x="300" y="345" width="245" height="95" rx="6" class="box"/>
<text x="422.5" y="374" class="center">Compare architectural state</text>
<text x="422.5" y="400" class="center small">handshakes, results, lane fronts</text>
<text x="422.5" y="423" class="center small">W, r and the training barrier</text>
<path d="M422.5 194 V223" class="arrow"/><path d="M422.5 315 V343" class="arrow"/><path d="M265 392 H298" class="arrow"/>
<rect x="575" y="120" width="245" height="95" rx="6" class="box"/>
<text x="697.5" y="149" class="center">Matrix · 7 profiles</text>
<text x="697.5" y="175" class="center small">N=3/5/9; LAYERS=1/3</text>
<text x="697.5" y="198" class="center small">WIDTH=8/16; G=0/1; J=1/2</text>
<rect x="575" y="245" width="245" height="70" rx="6" class="box"/>
<text x="697.5" y="273" class="center">Signed PE MAC and updates</text>
<text x="697.5" y="300" class="center small">load, saturation, stall and reset</text>
<rect x="575" y="345" width="245" height="95" rx="6" class="box"/>
<text x="697.5" y="374" class="center">Readout and parameters</text>
<text x="697.5" y="400" class="center small">full-width sum, fractional shift</text>
<text x="697.5" y="423" class="center small">reject unsupported N=1/2/4/8</text>
<line x1="20" x2="820" y1="460" y2="460" class="line"/>
<text x="20" y="486" class="head">4 integrated profiles · 3,545 checked edges</text>
<text x="20" y="514" class="small">Integer: N=3, L=3 (845 edges); N=5, L=3 (1,212 edges).</text>
<text x="20" y="540" class="small">Fixed point: N=3, L=3, F=2, G=1, J=2 (989); N=3, L=1, F=4 (499).</text>
<text x="20" y="570" class="small">Scenarios include loading gaps, bubbles, long stalls, reload, reset and all-layer learning.</text>
</svg>
