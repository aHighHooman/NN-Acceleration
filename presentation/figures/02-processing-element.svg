<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" width="1120" height="430" role="img" aria-labelledby="f02-title f02-desc"><title id="f02-title">PE roles by row, one registered MAC per PE, combinational column join</title><desc id="f02-desc">Each PE holds a stationary weight, plus a transposed copy that the backward pass uses, and registers activation, valid and partial sum on advancing edges, plus the weight its multiplier uses. Seed rows C-1 and C start sums from zero; upper rows add the sum from the row below and pass it up to row 0; lower rows add the sum from the row above and pass it down to row N-1. Activations enter the center column and move outward. Each column output is a combinational sum of the registered row-0 and row-N-1 sums, with no join register; the join, ReLU and requantization settle into the next stage's input register.</desc><style>
svg{--paper:#F3F5F3; --panel:#FFFFFF; --ink:#15191C; --ink-2:#48525A; --ink-3:#7A848B;
  --rule:#D5DBD8; --grid:#E5E9E6;
  --data:#2350C8; --data-soft:#DDE5FB; --learn:#CF4F16; --learn-soft:#FCE4D7;
  --store:#56665C; --store-soft:#E3EAE5; --ok:#2F7D4F; --warn:#B7791F;
  --display:"Arial Narrow","Roboto Condensed","Segoe UI",system-ui,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;}
@media (prefers-color-scheme:dark){svg{--paper:#101315; --panel:#171B1E; --ink:#E6E9EB; --ink-2:#AEB7BD; --ink-3:#7D878E;
    --rule:#2C3337; --grid:#20262A;
    --data:#86A6FF; --data-soft:#1B2847; --learn:#FF8F57; --learn-soft:#3A2116;
    --store:#A3B8AA; --store-soft:#1F2824; --ok:#63C28A; --warn:#E3B04B;}}
text{font-family:var(--body);fill:var(--ink);font-size:13px}
.m{font-family:var(--mono);font-size:12px}
.s{font-size:11.5px;fill:var(--ink-2)}
.ms{font-family:var(--mono);font-size:10.5px;fill:var(--ink-2)}
.b{font-weight:600}
.h{font-family:var(--display);font-weight:700;font-size:14px}
.mid{text-anchor:middle}
.end{text-anchor:end}
.muted{fill:var(--ink-3)}
.tdata{fill:var(--data)}
.tlearn{fill:var(--learn)}
.bx{fill:var(--panel);stroke:var(--ink);stroke-width:1.25}
.bx2{fill:var(--paper);stroke:var(--ink-3);stroke-width:1}
.bxd{fill:var(--data-soft);stroke:var(--data);stroke-width:1.25}
.bxl{fill:var(--learn-soft);stroke:var(--learn);stroke-width:1.5}
.bxs{fill:var(--store-soft);stroke:var(--store);stroke-width:1.25}
.frame{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:5 4}
.core{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}
.ld{fill:none;stroke:var(--data);stroke-width:2}
.ll{fill:none;stroke:var(--learn);stroke-width:2.25}
.ls{fill:none;stroke:var(--store);stroke-width:1.75}
.lk{fill:none;stroke:var(--ink-2);stroke-width:1.5}
.lg{fill:none;stroke:var(--grid);stroke-width:1}
.lr{fill:none;stroke:var(--rule);stroke-width:1}
.dash{stroke-dasharray:4 4}
.halo{fill:none;stroke:var(--panel);stroke-width:9}
.fd{fill:var(--data)} .fl{fill:var(--learn)} .fs{fill:var(--store)} .fk{fill:var(--ink-2)}
.fsoftd{fill:var(--data-soft)} .fsoftl{fill:var(--learn-soft)} .fsofts{fill:var(--store-soft)}
.fp{fill:var(--panel)} .fpp{fill:var(--paper)}
.ghost{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 2}
</style><rect x="1" y="1" width="1118" height="428" rx="10" style="fill:var(--panel);stroke:var(--rule)"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink-2)"/></marker></defs><text x="26" y="32" class="h">PE roles by row, one registered MAC per PE, combinational column join</text><rect x="40" y="58" width="320" height="150" rx="6" class="bxd"/><text x="200.0" y="84" class="mid b">UPPER ROWS  i &lt; C−1</text><text x="200.0" y="106" class="mid s">sum_in from row i+1</text><text x="200.0" y="128" class="mid s">Partial sum moves up to row 0</text><text x="200.0" y="150" class="mid s">sum ← sum_in + a·w</text><rect x="400" y="58" width="320" height="150" rx="6" class="bxd"/><text x="560.0" y="84" class="mid b">SEED ROWS  i = C−1, C</text><text x="560.0" y="106" class="mid s">sum_in = 0</text><text x="560.0" y="128" class="mid s">Start the upper and lower sums</text><text x="560.0" y="150" class="mid s">sum ← a·w</text><rect x="760" y="58" width="320" height="150" rx="6" class="bxd"/><text x="920.0" y="84" class="mid b">LOWER ROWS  i &gt; C</text><text x="920.0" y="106" class="mid s">sum_in from row i−1</text><text x="920.0" y="128" class="mid s">Partial sum moves down to row N−1</text><text x="920.0" y="150" class="mid s">sum ← sum_in + a·w</text><rect x="40" y="232" width="510" height="92" rx="6" class="bxd"/><text x="295.0" y="258" class="mid b">ACTIVATIONS MOVE OUTWARD</text><text x="295.0" y="280" class="mid s">Column C takes input lane i; j &lt; C reads j+1, j &gt; C reads j−1</text><text x="295.0" y="302" class="mid s">One valid bit marks both the activation and its sum</text><rect x="590" y="232" width="490" height="92" rx="6" class="bxs"/><text x="835.0" y="258" class="mid b">REGISTERED PER PE</text><text x="835.0" y="280" class="mid s">weight · selected weight · activation · valid · sum; advance = 0 holds the data</text><text x="835.0" y="302" class="mid s">cfg_we writes the weight; updates move ±1 LSB, saturating</text><text x="560" y="362" class="mid b">result[j] = sum[0][j] + sum[N−1][j] is combinational; there is no join register.</text><text x="560" y="392" class="mid s">C = (N−1)/2. The join, ReLU and requantization settle into the next stage’s input register in the cycle after the boundary rows capture.</text></svg>