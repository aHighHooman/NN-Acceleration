eight="55" rx="6" class="bxl"/><text x="945.0" y="216" class="mid b">Phase 2</text><text x="25" y="315" class="b">S0 R update</text><rect x="725" y="290" width="80" height="55" rx="6" class="bxl"/><text x="765.0" y="316" class="mid b">Pipe 0</text><rect x="815" y="290" width="80" height="55" rx="6" class="bxl"/><text x="855.0" y="316" class="mid b">Pipe 1</text><rect x="905" y="290" width="80" height="55" rx="6" class="bxl"/><text x="945.0" y="316" class="mid b">Pipe 2</text><rect x="995" y="290" width="80" height="55" rx="6" class="bxl"/><text x="1035.0" y="316" class="mid b">Commit</text><text x="560" y="391" class="mid b">S4 still sees old W and R; S5 sees the first coherent updated generation.</text></svg>