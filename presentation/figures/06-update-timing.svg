<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 430" width="1170" height="430" role="img" aria-labelledby="f06-title f06-desc"><title id="f06-title">Center-column timing · N=5, three layers, no stalls</title><desc id="f06-desc">For N=5 and three layers with no stalls, the input register accepts at edge 0. In each layer the center column captures row 2 first, rows 1 and 3 next and the boundary rows 0 and 4 on the third edge: edges 1-3, 4-6 and 7-9. The combinational join, ReLU and next-layer multiply settle between boundary capture and the next edge, so each layer adds D=3 edges. The readout column captures the same way on edges 10-12, the prediction enters the result FIFO at edge 13 and pops at edge 14.</desc><style>
svg{--paper:#F3F5F3; --panel:#FFFFFF; --ink:#15191C; --ink-2:#48525A; --ink-3:#7A848B;
  --rule:#D5DBD8; --grid:#E5E9E6;
  --data:#2350C8; --data-soft:#DDE5FB; --learn:#CF4F16; --learn-soft:#FCE4D7;
  --store:#56665C; --store-soft:#E3EAE5; --ok:#2F7D4F; --warn:#B7791F;
  --display:"Arial Narrow","Roboto Condensed","Segoe UI",system-ui,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;}
@media (prefers-color-scheme:dark){svg{--paper:#101315; --panel:#171B1E; --ink:#E6E9EB; --ink-2:#AEB7BD; --ink-3:#7D878E;
    --rule:#2C3337; --grid:#20262A;
    --data:#86A6FF; --data-soft:#1B2847; --learn:#FF8F57; --learn-soft:#3A2116;
    --store:#A3B8AA; --store-soft:#1F2824; --ok:#63C28A; --warn:#E3B04B;}}
