<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 440" width="1170" height="440" role="img" aria-labelledby="f06-title f06-desc"><title id="f06-title">Center-column timing · N=5, three layers, no stalls</title><desc id="f06-desc">For N=5 and three layers with no stalls, the input register accepts at edge 0. Layer 1 has no input register of its own: its center column captures row 2 on edge 1, rows 1 and 3 on edge 2 and the boundary rows 0 and 4 on edge 3. The join, ReLU, requantization and lane mux then settle into the next stage's input register, which captures on the following edge, so layer 2 runs on edges 4-7 and layer 3 on edges 8-11. The readout column registers its input on edge 12 and captures on edges 13-15, the prediction enters the result FIFO at edge 16 and pops at edge 17.</desc><style>
svg{--paper:#F3F5F3; --panel:#FFFFFF; --ink:#15191C; --ink-2:#48525A; --ink-3:#7A848B;
  --rule:#D5DBD8; --grid:#E5E9E6;
  --data:#2350C8; --data-soft:#DDE5FB; --learn:#CF4F16; --learn-soft:#FCE4D7;
  --store:#56665C; --store-soft:#E3EAE5; --ok:#2F7D4F; --warn:#B7791F;
  --display:"Arial Narrow","Roboto Condensed","Segoe UI",system-ui,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;}
@media (prefers-color-scheme:dark){svg{--paper:#101315; --panel:#171B1E; --ink:#E6E9EB; --ink-2:#AEB7BD; --ink-3:#7D878E;
    --rule:#2C3337; --grid:#20262A;
    --data:#86A6FF; --data-soft:#1B2847; --learn:#FF8F57; --learn-soft:#3A2116;
    --store:#A3B8AA; --store-soft:#1F2824; --ok:#63C28A; --warn:#E3B04B;}}
text{font-family:var(--body);fill:var(--ink);font-size:13px}
