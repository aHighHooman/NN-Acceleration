"32" rx="5" class="bxd"/><text x="597.0" y="179" class="mid ms">0, 4</text><text x="26" y="219" class="b">Layer 3</text><rect x="633" y="198" width="60" height="32" rx="5" class="bxd"/><text x="663.0" y="219" class="mid ms">2</text><rect x="699" y="198" width="60" height="32" rx="5" class="bxd"/><text x="729.0" y="219" class="mid ms">1, 3</text><rect x="765" y="198" width="60" height="32" rx="5" class="bxd"/><text x="795.0" y="219" class="mid ms">0, 4</text><text x="26" y="259" class="b">Readout column</text><rect x="831" y="238" width="60" height="32" rx="5" class="bxd"/><text x="861.0" y="259" class="mid ms">2</text><rect x="897" y="238" width="60" height="32" rx="5" class="bxd"/><text x="927.0" y="259" class="mid ms">1, 3</text><rect x="963" y="238" width="60" height="32" rx="5" class="bxd"/><text x="993.0" y="259" class="mid ms">0, 4</text><text x="26" y="299" class="b">Result FIFO</text><rect x="1029" y="278" width="60" height="32" rx="5" class="bxs"/><text x="1059.0" y="299" class="mid ms">Enqueue</text><rect x="1095" y="278" width="60" height="32" rx="5" class="bxs"/><text x="1125.0" y="299" class="mid ms">Pop</text><path d="M432,118 L432,232" class="lk dash"/><path d="M630,118 L630,232" class="lk dash"/><path d="M828,118 L828,272" class="lk dash"/><text x="585" y="340" class="mid s tdata">Dashed edges: the join, ReLU and next-stage multiply settle between boundary capture and the next edge.</text><text x="585" y="370" class="mid b">D = (N−1)/2 + 1 = 3 edges per stage; there is no join register.</text><text x="585" y="398" class="mid s">Column j runs |j−2| edges later: layer-3 lanes are ready after E[11,10,9,10,11], and each enters its readout row on the next edge.</text></svg>