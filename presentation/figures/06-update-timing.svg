.b{font-weight:600}
.h{font-family:var(--display);font-weight:700;font-size:14px}
.mid{text-anchor:middle}
.end{text-anchor:end}
.muted{fill:var(--ink-3)}
.tdata{fill:var(--data)}
.tlearn{fill:var(--learn)}
.bx{fill:var(--panel);stroke:var(--ink);stroke-width:1.25}
.bx2{fill:var(--paper);stroke:var(--ink-3);stroke-width:1}
.bxd{fill:var(--data-soft);stroke:var(--data);stroke-width:1.25}
.bxl{fill:var(--learn-soft);stroke:var(--learn);stroke-width:1.5}
.bxs{fill:var(--store-soft);stroke:var(--store);stroke-width:1.25}
.frame{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:5 4}
.core{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}
.ld{fill:none;stroke:var(--data);stroke-width:2}
.ll{fill:none;stroke:var(--learn);stroke-width:2.25}
.ls{fill:none;stroke:var(--store);stroke-width:1.75}
.lk{fill:none;stroke:var(--ink-2);stroke-width:1.5}
.lg{fill:none;stroke:var(--grid);stroke-width:1}
.lr{fill:none;stroke:var(--rule);stroke-width:1}
.dash{stroke-dasharray:4 4}
.halo{fill:none;stroke:var(--panel);stroke-width:9}
.fd{fill:var(--data)} .fl{fill:var(--learn)} .fs{fill:var(--store)} .fk{fill:var(--ink-2)}
.fsoftd{fill:var(--data-soft)} .fsoftl{fill:var(--learn-soft)} .fsofts{fill:var(--store-soft)}
.fp{fill:var(--panel)} .fpp{fill:var(--paper)}
.ghost{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 2}
</style><rect x="1" y="1" width="1168" height="438" rx="10" style="fill:var(--panel);stroke:var(--rule)"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink-2)"/></marker></defs><text x="26" y="32" class="h">Center-column timing · N=5, three layers, no stalls</text><text x="207.0" y="64" class="mid m">E0</text><text x="261.0" y="64" class="mid m">E1</text><text x="315.0" y="64" class="mid m">E2</text><text x="369.0" y="64" class="mid m">E3</text><text x="423.0" y="64" class="mid m">E4</text><text x="477.0" y="64" class="mid m">E5</text><text x="531.0" y="64" class="mid m">E6</text><text x="585.0" y="64" class="mid m">E7</text><text x="639.0" y="64" class="mid m">E8</text><text x="693.0" y="64" class="mid m">E9</text><text x="747.0" y="64" class="mid m">E10</text><text x="801.0" y="64" class="mid m">E11</text><text x="855.0" y="64" class="mid m">E12</text><text x="909.0" y="64" class="mid m">E13</text><text x="963.0" y="64" class="mid m">E14</text><text x="1017.0" y="64" class="mid m">E15</text><text x="1071.0" y="64" class="mid m">E16</text><text x="1125.0" y="64" class="mid m">E17</text><text x="26" y="64" class="ms">cells: PE rows, column 2</text><text x="26" y="99" class="b">Input register</text><rect x="183" y="78" width="48" height="32" rx="5" class="bxd"/><text x="207.0" y="99" class="mid ms">Accept</text><text x="26" y="139" class="b">Layer 1</text><rect x="237" y="118" width="48" height="32" rx="5" class="bxd"/><text x="261.0" y="139" class="mid ms">2</text><rect x="291" y="118" width="48" height="32" rx="5" class="bxd"/><text x="315.0" y="139" class="mid ms">1, 3</text><rect x="345" y="118" width="48" height="32" rx="5" class="bxd"/><text x="369.0" y="139" class="mid ms">0, 4</text><text x="26" y="179" class="b">Layer 2</text><rect x="399" y="158" width="48" height="32" rx="5" class="bxs"/><text x="423.0" y="179" class="mid ms">reg</text><rect x="453" y="158" width="48" height="32" rx="5" class="bxd"/><text x="477.0" y="179" class="mid ms">2</text><rect x="507" y="158" width="48" height="32" rx="5" class="bxd"/><text x="531.0" y="179" class="mid ms">1, 3</text><rect x="561" y="158" width="48" height="32" rx="5" class="bxd"/><text x="585.0" y="179" class="mid ms">0, 4</text><text x="26" y="219" class="b">Layer 3</text><rect x="615" y="198" width="48" height="32" rx="5" class="bxs"/><text x="639.0" y="219" class="mid ms">reg</text><rect x="669" y="198" width="48" height="32" rx="5" class="bxd"/><text x="693.0" y="219" class="mid ms">2</text><rect x="723" y="198" width="48" height="32" rx="5" class="bxd"/><text x="747.0" y="219" class="mid ms">1, 3</text><rect x="777" y="198" width="48" height="32" rx="5" class="bxd"/><text x="801.0" y="219" class="mid ms">0, 4</text><text x="26" y="259" class="b">Readout column</text><rect x="831" y="238" width="48" height="32" rx="5" class="bxs"/><text x="855.0" y="259" class="mid ms">reg</text><rect x="885" y="238" width="48" height="32" rx="5" class="bxd"/><text x="909.0" y="259" class="mid ms">2</text><rect x="939" y="238" width="48" height="32" rx="5" class="bxd"/><text x="963.0" y="259" class="mid ms">1, 3</text><rect x="993" y="238" width="48" height="32" rx="5" class="bxd"/><text x="1017.0" y="259" class="mid ms">0, 4</text><text x="26" y="299" class="b">Result FIFO</text><rect x="1047" y="278" width="48" height="32" rx="5" class="bxs"/><text x="1071.0" y="299" class="mid ms">Enqueue</text><rect x="1101" y="278" width="48" height="32" rx="5" class="bxs"/><text x="1125.0" y="299" class="mid ms">Pop</text><path d="M396,118 L396,192" class="lk dash"/><path d="M612,118 L612,232" class="lk dash"/><path d="M828,118 L828,272" class="lk dash"/><text x="585" y="336" class="mid s tdata">Dashed edges: the join, ReLU, requantization and lane mux settle between boundary capture and the next stage's input register (reg).</text><text x="585" y="366" class="mid b">Layer 1 takes D = (N−1)/2 + 1 = 3 edges; every later stage and the readout take D + 1 = 4, one for the input register.</text><text x="585" y="394" class="mid s">Column j runs |j−2| edges later: layer-3 lanes are ready after E[13,12,11,12,13], and each enters the readout's input register on the next edge.</text><text x="585" y="420" class="mid s">The input registers add three edges, but the clock runs faster, so the time per result is lower.</text></svg>