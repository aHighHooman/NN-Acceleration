<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" width="1120" height="430" role="img" aria-labelledby="f08-title f08-desc"><title id="f08-title">One advance signal freezes the matrix datapath under backpressure</title><desc id="f08-desc">When the consumer stalls and the result FIFO is full while the collector holds a vector, arrayAdvance falls. The input register, source skew, every PE register and the collector hold their state, and admission stops once the input register cannot pop. When the consumer is ready, retirement, enqueue and advance can happen on one edge.</desc><style>
svg{--paper:#F3F5F3; --panel:#FFFFFF; --ink:#15191C; --ink-2:#48525A; --ink-3:#7A848B;
  --rule:#D5DBD8; --grid:#E5E9E6;
  --data:#2350C8; --data-soft:#DDE5FB; --learn:#CF4F16; --learn-soft:#FCE4D7;
  --store:#56665C; --store-soft:#E3EAE5; --ok:#2F7D4F; --warn:#B7791F;
  --display:"Arial Narrow","Roboto Condensed","Segoe UI",system-ui,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;}
@media (prefers-color-scheme:dark){svg{--paper:#101315; --panel:#171B1E; --ink:#E6E9EB; --ink-2:#AEB7BD; --ink-3:#7D878E;
    --rule:#2C3337; --grid:#20262A;
    --data:#86A6FF; --data-soft:#1B2847; --learn:#FF8F57; --learn-soft:#3A2116;
    --store:#A3B8AA; --store-soft:#1F2824; --ok:#63C28A; --warn:#E3B04B;}}
text{font-family:var(--body);fill:var(--ink);font-size:13px}
.m{font-family:var(--mono);font-size:12px}
.s{font-size:11.5px;fill:var(--ink-2)}
.ms{font-family:var(--mono);font-size:10.5px;fill:var(--ink-2)}
.b{font-weight:600}
.h{font-family:var(--display);font-weight:700;font-size:14px}
.mid{text-anchor:middle}
.end{text-anchor:end}
.muted{fill:var(--ink-3)}
.tdata{fill:var(--data)}
.tlearn{fill:var(--learn)}
.bx{fill:var(--panel);stroke:var(--ink);stroke-width:1.25}
.bx2{fill:var(--paper);stroke:var(--ink-3);stroke-width:1}
.bxd{fill:var(--data-soft);stroke:var(--data);stroke-width:1.25}
.bxl{fill:var(--learn-soft);stroke:var(--learn);stroke-width:1.5}
.bxs{fill:var(--store-soft);stroke:var(--store);stroke-width:1.25}
.frame{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:5 4}
.core{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}
.ld{fill:none;stroke:var(--data);stroke-width:2}
.ll{fill:none;stroke:var(--learn);stroke-width:2.25}
.ls{fill:none;stroke:var(--store);stroke-width:1.75}
.lk{fill:none;stroke:var(--ink-2);stroke-width:1.5}
.lg{fill:none;stroke:var(--grid);stroke-width:1}
.lr{fill:none;stroke:var(--rule);stroke-width:1}
.dash{stroke-dasharray:4 4}
.halo{fill:none;stroke:var(--panel);stroke-width:9}
.fd{fill:var(--data)} .fl{fill:var(--learn)} .fs{fill:var(--store)} .fk{fill:var(--ink-2)}
.fsoftd{fill:var(--data-soft)} .fsoftl{fill:var(--learn-soft)} .fsofts{fill:var(--store-soft)}
.fp{fill:var(--panel)} .fpp{fill:var(--paper)}
.ghost{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 2}
</style><rect x="1" y="1" width="1118" height="428" rx="10" style="fill:var(--panel);stroke:var(--rule)"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink-2)"/></marker></defs><text x="26" y="32" class="h">One advance signal freezes the matrix datapath under backpressure</text><rect x="40" y="78" width="300" height="140" rx="6" class="bxs"/><text x="190.0" y="104" class="mid b">CONSUMER STALLS</text><text x="190.0" y="126" class="mid s">resultReady = 0</text><text x="190.0" y="148" class="mid s">resultFifo fills (depth 2N)</text><text x="190.0" y="170" class="mid s">Collector holds a full vector</text><path d="M340,148 L384,148" class="lk" marker-end="url(#arrow)"/><rect x="390" y="78" width="330" height="140" rx="6" class="bxd"/><text x="555.0" y="104" class="mid b">arrayAdvance = 0</text><text x="555.0" y="126" class="mid s">Input register and source skew hold</text><text x="555.0" y="148" class="mid s">Every PE register holds</text><text x="555.0" y="170" class="mid s">Collector holds; nothing is lost</text><path d="M720,148 L764,148" class="lk" marker-end="url(#arrow)"/><rect x="770" y="78" width="310" height="140" rx="6" class="bxs"/><text x="925.0" y="104" class="mid b">ADMISSION STOPS</text><text x="925.0" y="126" class="mid s">inputReady falls when the</text><text x="925.0" y="148" class="mid s">input register cannot pop</text><text x="925.0" y="170" class="mid s">The in-flight count also limits it</text><rect x="180" y="262" width="760" height="75" rx="6" class="bxs"/><text x="560.0" y="288" class="mid b">Consumer ready: retire, enqueue and advance can share one edge</text><text x="560.0" y="310" class="mid s">Input bubbles advance normally; only a waiting vector with a full FIFO freezes the core.</text><text x="560" y="386" class="mid s">arrayAdvance = weightsLoaded and not (collector valid and FIFO unable to accept). Training runs only after the pipeline drains.</text></svg>