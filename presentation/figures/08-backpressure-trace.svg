<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" width="1120" height="430" role="img" aria-label="A single advance signal preserves computation and learning under stalls"><title>A single advance signal preserves computation and learning under stalls</title><style>
svg{--paper:#F3F5F3; --panel:#FFFFFF; --ink:#15191C; --ink-2:#48525A; --ink-3:#7A848B;
  --rule:#D5DBD8; --grid:#E5E9E6;
  --data:#2350C8; --data-soft:#DDE5FB; --learn:#CF4F16; --learn-soft:#FCE4D7;
  --store:#56665C; --store-soft:#E3EAE5; --ok:#2F7D4F; --warn:#B7791F;
  --display:"Arial Narrow","Roboto Condensed","Segoe UI",system-ui,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;}
@media (prefers-color-scheme:dark){svg{--paper:#101315; --panel:#171B1E; --ink:#E6E9EB; --ink-2:#AEB7BD; --ink-3:#7D878E;
    --rule:#2C3337; --grid:#20262A;
    --data:#86A6FF; --data-soft:#1B2847; --learn:#FF8F57; --learn-soft:#3A2116;
    --store:#A3B8AA; --store-soft:#1F2824; --ok:#63C28A; --warn:#E3B04B;}}
text{font-family:var(--body);fill:var(--ink);font-size:13px}
.m{font-family:var(--mono);font-size:12px}
.s{font-size:11.5px;fill:var(--ink-2)}
.ms{font-family:var(--mono);font-size:10.5px;fill:var(--ink-2)}
.b{font-weight:600}
.h{font-family:var(--display);font-weight:700;font-size:14px}
.mid{text-anchor:middle}
.end{text-anchor:end}
.muted{fill:var(--ink-3)}
.tdata{fill:var(--data)}
.tlearn{fill:var(--learn)}
.bx{fill:var(--panel);stroke:var(--ink);stroke-width:1.25}
.bx2{fill:var(--paper);stroke:var(--ink-3);stroke-width:1}
.bxd{fill:var(--data-soft);stroke:var(--data);stroke-width:1.25}
.bxl{fill:var(--learn-soft);stroke:var(--learn);stroke-width:1.5}
.bxs{fill:var(--store-soft);stroke:var(--store);stroke-width:1.25}
.frame{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:5 4}
.core{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}
.ld{fill:none;stroke:var(--data);stroke-width:2}
.ll{fill:none;stroke:var(--learn);stroke-width:2.25}
.ls{fill:none;stroke:var(--store);stroke-width:1.75}
.lk{fill:none;stroke:var(--ink-2);stroke-width:1.5}
.lg{fill:none;stroke:var(--grid);stroke-width:1}
.lr{fill:none;stroke:var(--rule);stroke-width:1}
.dash{stroke-dasharray:4 4}
.halo{fill:none;stroke:var(--panel);stroke-width:9}
.fd{fill:var(--data)} .fl{fill:var(--learn)} .fs{fill:var(--store)} .fk{fill:var(--ink-2)}
.fsoftd{fill:var(--data-soft)} .fsoftl{fill:var(--learn-soft)} .fsofts{fill:var(--store-soft)}
.fp{fill:var(--panel)} .fpp{fill:var(--paper)}
.ghost{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 2}
</style><rect x="1" y="1" width="1118" height="428" rx="10" style="fill:var(--panel);stroke:var(--rule)"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink-2)"/></marker></defs><text x="26" y="32" class="h">A single advance signal preserves computation and learning under stalls</text><rect x="50" y="80" width="280" height="130" rx="6" class="bxs"/><text x="190.0" y="106" class="mid b">CONSUMER STALLS</text><text x="190.0" y="128" class="mid s">Results accumulate</text><text x="190.0" y="150" class="mid s">Learning continues while space remains</text><text x="190.0" y="172" class="mid s">Waiting result + full FIFO</text><path d="M330,145 L380,145" class="ls" marker-end="url(#arrow)"/><rect x="390" y="80" width="310" height="130" rx="6" class="bxd"/><text x="545.0" y="106" class="mid b">arrayAdvance = 0</text><text x="545.0" y="128" class="mid s">Both activation skew taps hold</text><text x="545.0" y="150" class="mid s">Both inward psum directions hold</text><text x="545.0" y="172" class="mid s">AD result and valid state hold</text><path d="M700,145 L750,145" class="ll" marker-end="url(#arrow)"/><rect x="760" y="80" width="310" height="130" rx="6" class="bxl"/><text x="915.0" y="106" class="mid b">LEARNING ALSO HOLDS</text><text x="915.0" y="128" class="mid s">Matrix update phases hold</text><text x="915.0" y="150" class="mid s">Reduction update pipe holds</text><text x="915.0" y="172" class="mid s">No partial update escapes</text><rect x="180" y="270" width="760" height="75" rx="6" class="bxs"/><text x="560.0" y="296" class="mid b">Consumer ready: retire + enqueue + advance can share one edge</text><text x="560.0" y="318" class="mid s">Input bubbles advance normally; only actual output backpressure freezes the core.</text><text x="560" y="391" class="mid s">Control schematic: stall duration depends on FIFO occupancy and pending samples.</text></svg>