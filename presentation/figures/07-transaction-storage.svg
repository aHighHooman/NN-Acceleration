<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 1032 442" width="1032" height="442" role="img" aria-label="Bit layouts at N=3, WIDTH=16. The sampleContextFifo entry is 23 bits: 16-bit target, 6 bits of input signs, 1 training bit. The resultFifo entry is 144 bits: 6 bits of reduction-weight signs, a 36-bit prediction and three 34-bit activated elements. Below, a steady-state snapshot shows the context FIFO holding 8 samples while the result FIFO holds 1, with both heads being the same sample.">
<title>Transaction storage</title>
<style>
svg{--paper:#F3F5F3; --panel:#FFFFFF; --ink:#15191C; --ink-2:#48525A; --ink-3:#7A848B;
  --rule:#D5DBD8; --grid:#E5E9E6;
  --data:#2350C8; --data-soft:#DDE5FB; --learn:#CF4F16; --learn-soft:#FCE4D7;
  --store:#56665C; --store-soft:#E3EAE5; --ok:#2F7D4F; --warn:#B7791F;
  --display:"Arial Narrow","Roboto Condensed","Segoe UI",system-ui,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;}
@media (prefers-color-scheme:dark){svg{--paper:#101315; --panel:#171B1E; --ink:#E6E9EB; --ink-2:#AEB7BD; --ink-3:#7D878E;
    --rule:#2C3337; --grid:#20262A;
    --data:#86A6FF; --data-soft:#1B2847; --learn:#FF8F57; --learn-soft:#3A2116;
    --store:#A3B8AA; --store-soft:#1F2824; --ok:#63C28A; --warn:#E3B04B;}}
text{font-family:var(--body);fill:var(--ink);font-size:13px}
.m{font-family:var(--mono);font-size:12px}
.s{font-size:11.5px;fill:var(--ink-2)}
.ms{font-family:var(--mono);font-size:10.5px;fill:var(--ink-2)}
.b{font-weight:600}
.h{font-family:var(--display);font-weight:700;font-size:14px}
.mid{text-anchor:middle}
.end{text-anchor:end}
.muted{fill:var(--ink-3)}
.tdata{fill:var(--data)}
.tlearn{fill:var(--learn)}
.bx{fill:var(--panel);stroke:var(--ink);stroke-width:1.25}
.bx2{fill:var(--paper);stroke:var(--ink-3);stroke-width:1}
.bxd{fill:var(--data-soft);stroke:var(--data);stroke-width:1.25}
.bxl{fill:var(--learn-soft);stroke:var(--learn);stroke-width:1.5}
.bxs{fill:var(--store-soft);stroke:var(--store);stroke-width:1.25}
.frame{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:5 4}
.core{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}
.ld{fill:none;stroke:var(--data);stroke-width:2}
.ll{fill:none;stroke:var(--learn);stroke-width:2.25}
.ls{fill:none;stroke:var(--store);stroke-width:1.75}
.lk{fill:none;stroke:var(--ink-2);stroke-width:1.5}
.lg{fill:none;stroke:var(--grid);stroke-width:1}
.lr{fill:none;stroke:var(--rule);stroke-width:1}
.dash{stroke-dasharray:4 4}
.halo{fill:none;stroke:var(--panel);stroke-width:9}
.fd{fill:var(--data)} .fl{fill:var(--learn)} .fs{fill:var(--store)} .fk{fill:var(--ink-2)}
.fsoftd{fill:var(--data-soft)} .fsoftl{fill:var(--learn-soft)} .fsofts{fill:var(--store-soft)}
.fp{fill:var(--panel)} .fpp{fill:var(--paper)}
.ghost{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 2}
</style>
<rect x="-15.5" y="-15.5" width="1031" height="441" rx="10" style="fill:var(--panel);stroke:var(--rule)"/>
<text x="20" y="26" class="h">resultFifo entry · 144 bits at N = 3, WIDTH = 16</text>
      <g>
        <rect x="60" y="40" width="37.5" height="38" class="bxl"/><rect x="97.5" y="40" width="225" height="38" class="bxd"/>
        <rect x="322.5" y="40" width="212.5" height="38" class="bxs"/><rect x="535" y="40" width="212.5" height="38" class="bxs"/><rect x="747.5" y="40" width="212.5" height="38" class="bxs"/>
      </g>
      <text x="210" y="64" class="mid m">ŷ prediction · 36</text>
      <text x="428.75" y="64" class="mid m">a[2] · 34</text><text x="641.25" y="64" class="mid m">a[1] · 34</text><text x="853.75" y="64" class="mid m">a[0] · 34</text>
      <text x="60" y="94" class="ms">143</text><text x="960" y="94" class="end ms">0</text>
      <line x1="78.75" y1="78" x2="78.75" y2="104" class="lk"/>
      <text x="78.75" y="118" class="mid s">sign r[N] · 6</text>
      <text x="322.5" y="94" class="mid ms">101</text><text x="97.5" y="94" class="ms" dx="4">137</text>
      <text x="20" y="160" class="h">sampleContextFifo entry · 23 bits</text>
      <g>
        <rect x="60" y="172" width="100" height="38" class="bxs"/><rect x="160" y="172" width="37.5" height="38" class="bxl"/><rect x="197.5" y="172" width="6.25" height="38" class="bxd"/>
      </g>
      <text x="110" y="196" class="mid m">t · 16</text>
      <line x1="178.75" y1="210" x2="178.75" y2="232" class="lk"/><text x="178.75" y="246" class="mid s">sign x[N] · 6</text>
      <line x1="200.6" y1="172" x2="236" y2="160" class="lk"/><text x="240" y="162" class="s">trainingEnable · 1</text>
      <text x="300" y="196" class="s">Same horizontal scale as above: the result word is about 6× wider.</text>
      <text x="300" y="214" class="ms">Ternary signs use 2 bits each: 01 = +1, 00 = 0, 11 = −1. The raw matrix result is never stored.</text>
      <!-- stacks -->
      <line x1="20" y1="272" x2="980" y2="272" class="lr"/>
      <text x="20" y="298" class="h">Steady state at full speed (from cycle.py)</text>
      <text x="20" y="330" class="s">context</text><text x="20" y="344" class="ms">8 of 2N+2</text>
      <g>
        <rect x="100" y="318" width="64" height="30" rx="3" class="bxs"/><text x="132" y="338" class="mid ms">S10</text>
        <rect x="170" y="318" width="64" height="30" rx="3" class="bxs"/><text x="202" y="338" class="mid ms">S9</text>
        <rect x="240" y="318" width="64" height="30" rx="3" class="bxs"/><text x="272" y="338" class="mid ms">S8</text>
        <rect x="310" y="318" width="64" height="30" rx="3" class="bxs"/><text x="342" y="338" class="mid ms">S7</text>
        <rect x="380" y="318" width="64" height="30" rx="3" class="bxs"/><text x="412" y="338" class="mid ms">S6</text>
        <rect x="450" y="318" width="64" height="30" rx="3" class="bxs"/><text x="482" y="338" class="mid ms">S5</text>
        <rect x="520" y="318" width="64" height="30" rx="3" class="bxs"/><text x="552" y="338" class="mid ms">S4</text>
        <rect x="590" y="318" width="64" height="30" rx="3" class="bxs" style="stroke-width:2.5"/><text x="622" y="338" class="mid ms b">S3</text>
      </g>
      <text x="20" y="384" class="s">result</text><text x="20" y="398" class="ms">1 of 2N</text>
      <g>
        <rect x="240" y="370" width="64" height="30" rx="3" class="bx2"/><rect x="310" y="370" width="64" height="30" rx="3" class="bx2"/>
        <rect x="380" y="370" width="64" height="30" rx="3" class="bx2"/><rect x="450" y="370" width="64" height="30" rx="3" class="bx2"/>
        <rect x="520" y="370" width="64" height="30" rx="3" class="bx2"/>
        <rect x="590" y="370" width="64" height="30" rx="3" class="bxs" style="stroke-width:2.5"/><text x="622" y="390" class="mid ms b">S3</text>
      </g>
      <polyline points="654,333 700,333 700,358" class="ls"/><polyline points="654,385 700,385 700,362" class="ls"/>
      <circle cx="700" cy="360" r="4" class="fs"/>
      <line x1="704" y1="360" x2="744" y2="360" class="ld"/>
      <rect x="746" y="340" width="96" height="40" rx="4" class="bx"/><text x="794" y="365" class="mid b">retire S3</text>
      <text x="858" y="352" class="s">both pop</text><text x="858" y="370" class="s">together</text>
      <text x="100" y="312" class="ms muted">tail (accepted)</text><text x="654" y="312" class="end ms muted">head</text>
</svg>
