<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" width="1120" height="430" role="img" aria-labelledby="f07-title f07-desc"><title id="f07-title">Transaction storage: one input register, an in-flight count and one result FIFO</title><desc id="f07-desc">Sample storage is a one-entry input register, an outstanding-sample counter bounded by IN_FLIGHT_DEPTH, a result FIFO holding the activated vector and prediction, and one training context. There are no per-sample tags or context FIFO because samples stay in admission order. At N=3 with three layers the default in-flight limit is 23 and the FIFO depth is 6.</desc><style>
svg{--paper:#F3F5F3; --panel:#FFFFFF; --ink:#15191C; --ink-2:#48525A; --ink-3:#7A848B;
  --rule:#D5DBD8; --grid:#E5E9E6;
  --data:#2350C8; --data-soft:#DDE5FB; --learn:#CF4F16; --learn-soft:#FCE4D7;
  --store:#56665C; --store-soft:#E3EAE5; --ok:#2F7D4F; --warn:#B7791F;
  --display:"Arial Narrow","Roboto Condensed","Segoe UI",system-ui,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;}
@media (prefers-color-scheme:dark){svg{--paper:#101315; --panel:#171B1E; --ink:#E6E9EB; --ink-2:#AEB7BD; --ink-3:#7D878E;
    --rule:#2C3337; --grid:#20262A;
    --data:#86A6FF; --data-soft:#1B2847; --learn:#FF8F57; --learn-soft:#3A2116;
    --store:#A3B8AA; --store-soft:#1F2824; --ok:#63C28A; --warn:#E3B04B;}}
text{font-family:var(--body);fill:var(--ink);font-size:13px}
.m{font-family:var(--mono);font-size:12px}
.s{font-size:11.5px;fill:var(--ink-2)}
.ms{font-family:var(--mono);font-size:10.5px;fill:var(--ink-2)}
.b{font-weight:600}
.h{font-family:var(--display);font-weight:700;font-size:14px}
.mid{text-anchor:middle}
.end{text-anchor:end}
.muted{fill:var(--ink-3)}
.tdata{fill:var(--data)}
.tlearn{fill:var(--learn)}
.bx{fill:var(--panel);stroke:var(--ink);stroke-width:1.25}
.bx2{fill:var(--paper);stroke:var(--ink-3);stroke-width:1}
.bxd{fill:var(--data-soft);stroke:var(--data);stroke-width:1.25}
.bxl{fill:var(--learn-soft);stroke:var(--learn);stroke-width:1.5}
.bxs{fill:var(--store-soft);stroke:var(--store);stroke-width:1.25}
.frame{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:5 4}
.core{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}
.ld{fill:none;stroke:var(--data);stroke-width:2}
.ll{fill:none;stroke:var(--learn);stroke-width:2.25}
.ls{fill:none;stroke:var(--store);stroke-width:1.75}
.lk{fill:none;stroke:var(--ink-2);stroke-width:1.5}
.lg{fill:none;stroke:var(--grid);stroke-width:1}
.lr{fill:none;stroke:var(--rule);stroke-width:1}
.dash{stroke-dasharray:4 4}
.halo{fill:none;stroke:var(--panel);stroke-width:9}
.fd{fill:var(--data)} .fl{fill:var(--learn)} .fs{fill:var(--store)} .fk{fill:var(--ink-2)}
.fsoftd{fill:var(--data-soft)} .fsoftl{fill:var(--learn-soft)} .fsofts{fill:var(--store-soft)}
.fp{fill:var(--panel)} .fpp{fill:var(--paper)}
.ghost{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 2}
</style><rect x="1" y="1" width="1118" height="428" rx="10" style="fill:var(--panel);stroke:var(--rule)"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink-2)"/></marker></defs><text x="26" y="32" class="h">Transaction storage: one input register, an in-flight count and one result FIFO</text><rect x="30" y="70" width="240" height="150" rx="6" class="bxs"/><text x="150.0" y="96" class="mid b">INPUT REGISTER</text><text x="150.0" y="118" class="mid s">One entry: inputData[N]</text><text x="150.0" y="140" class="mid s">Pops on every advancing edge</text><rect x="300" y="70" width="240" height="150" rx="6" class="bxs"/><text x="420.0" y="96" class="mid b">IN-FLIGHT COUNT</text><text x="420.0" y="118" class="mid s">outstanding ≤ IN_FLIGHT_DEPTH</text><text x="420.0" y="140" class="mid s">Default LAYERS(N+2)+2N+2</text><text x="420.0" y="162" class="mid s">N=3, three layers: 23</text><rect x="570" y="70" width="250" height="150" rx="6" class="bxs"/><text x="695.0" y="96" class="mid b">resultFifo</text><text x="695.0" y="118" class="mid s">{activated vector, prediction}</text><text x="695.0" y="140" class="mid s">Default depth 2N</text><text x="695.0" y="162" class="mid s">Pop retires one sample</text><rect x="850" y="70" width="240" height="150" rx="6" class="bxl"/><text x="970.0" y="96" class="mid b">TRAINING CONTEXT</text><text x="970.0" y="118" class="mid s">One sample at a time</text><text x="970.0" y="140" class="mid s">target · sign x · gates · signs</text><text x="970.0" y="162" class="mid s">Retires when outstanding = 1</text><text x="560" y="268" class="mid b">No per-sample tags or context FIFO: order is fixed, so each lane’s next valid value is the next admitted sample.</text><text x="560" y="303" class="mid s">Admission stops after a training sample, so its taps are the last values seen and it is the last to retire.</text><text x="560" y="343" class="mid s">N=3, three layers, continuous traffic: 9 outstanding, FIFO occupancy 1.</text><text x="560" y="371" class="mid s">With resultReady low, the array freezes at 14 outstanding with the FIFO full (6), below the limit of 23.</text></svg>