<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" width="1120" height="430" role="img" aria-label="Two-ended loading through the existing MAC partial-sum paths"><title>Two-ended loading through the existing MAC partial-sum paths</title><style>
svg{--paper:#F3F5F3; --panel:#FFFFFF; --ink:#15191C; --ink-2:#48525A; --ink-3:#7A848B;
  --rule:#D5DBD8; --grid:#E5E9E6;
  --data:#2350C8; --data-soft:#DDE5FB; --learn:#CF4F16; --learn-soft:#FCE4D7;
  --store:#56665C; --store-soft:#E3EAE5; --ok:#2F7D4F; --warn:#B7791F;
  --display:"Arial Narrow","Roboto Condensed","Segoe UI",system-ui,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;}
@media (prefers-color-scheme:dark){svg{--paper:#101315; --panel:#171B1E; --ink:#E6E9EB; --ink-2:#AEB7BD; --ink-3:#7D878E;
    --rule:#2C3337; --grid:#20262A;
    --data:#86A6FF; --data-soft:#1B2847; --learn:#FF8F57; --learn-soft:#3A2116;
    --store:#A3B8AA; --store-soft:#1F2824; --ok:#63C28A; --warn:#E3B04B;}}
text{font-family:var(--body);fill:var(--ink);font-size:13px}
.m{font-family:var(--mono);font-size:12px}
.s{font-size:11.5px;fill:var(--ink-2)}
.ms{font-family:var(--mono);font-size:10.5px;fill:var(--ink-2)}
.b{font-weight:600}
.h{font-family:var(--display);font-weight:700;font-size:14px}
.mid{text-anchor:middle}
.end{text-anchor:end}
.muted{fill:var(--ink-3)}
.tdata{fill:var(--data)}
.tlearn{fill:var(--learn)}
.bx{fill:var(--panel);stroke:var(--ink);stroke-width:1.25}
.bx2{fill:var(--paper);stroke:var(--ink-3);stroke-width:1}
.bxd{fill:var(--data-soft);stroke:var(--data);stroke-width:1.25}
.bxl{fill:var(--learn-soft);stroke:var(--learn);stroke-width:1.5}
.bxs{fill:var(--store-soft);stroke:var(--store);stroke-width:1.25}
.frame{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:5 4}
.core{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}
.ld{fill:none;stroke:var(--data);stroke-width:2}
.ll{fill:none;stroke:var(--learn);stroke-width:2.25}
.ls{fill:none;stroke:var(--store);stroke-width:1.75}
.lk{fill:none;stroke:var(--ink-2);stroke-width:1.5}
.lg{fill:none;stroke:var(--grid);stroke-width:1}
.lr{fill:none;stroke:var(--rule);stroke-width:1}
.dash{stroke-dasharray:4 4}
.halo{fill:none;stroke:var(--panel);stroke-width:9}
.fd{fill:var(--data)} .fl{fill:var(--learn)} .fs{fill:var(--store)} .fk{fill:var(--ink-2)}
.fsoftd{fill:var(--data-soft)} .fsoftl{fill:var(--learn-soft)} .fsofts{fill:var(--store-soft)}
.fp{fill:var(--panel)} .fpp{fill:var(--paper)}
.ghost{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 2}
</style><rect x="1" y="1" width="1118" height="428" rx="10" style="fill:var(--panel);stroke:var(--rule)"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink-2)"/></marker></defs><text x="26" y="32" class="h">Two-ended loading through the existing MAC partial-sum paths</text><rect x="30" y="105" width="230" height="125" rx="6" class="bxs"/><text x="145.0" y="131" class="mid b">COLLECT N ROWS</text><text x="145.0" y="153" class="mid s">Host order: bottom first</text><text x="145.0" y="175" class="mid s">One row per handshake</text><text x="145.0" y="197" class="mid s">Gaps allowed</text><path d="M260,168 L299,168" class="ls" marker-end="url(#arrow)"/><rect x="300" y="105" width="300" height="125" rx="6" class="bxs"/><text x="450.0" y="131" class="mid b">SHIFT N ADVANCES</text><text x="450.0" y="153" class="mid s">Top: W[N-1-q][j], q &gt;= j</text><text x="450.0" y="175" class="mid s">Bottom: W[q][j], q &gt;= N-j</text><text x="450.0" y="197" class="mid s">Other slots padded with zero</text><path d="M600,168 L639,168" class="ls" marker-end="url(#arrow)"/><rect x="640" y="105" width="220" height="125" rx="6" class="bxs"/><text x="750.0" y="131" class="mid b">CAPTURE ONE EDGE</text><text x="750.0" y="153" class="mid s">psum register -&gt; W</text><text x="750.0" y="175" class="mid s">All PEs capture together</text><text x="750.0" y="197" class="mid s">weightsLoaded rises</text><path d="M860,168 L899,168" class="ls" marker-end="url(#arrow)"/><rect x="900" y="105" width="190" height="125" rx="6" class="bxs"/><text x="995.0" y="131" class="mid b">COMPUTE</text><text x="995.0" y="153" class="mid s">Input now accepted</text><text x="995.0" y="175" class="mid s">Resident W stays put</text><text x="560" y="278" class="mid b">Resident W remains unchanged throughout collection and all N shifts.</text><text x="560" y="313" class="mid s">During load: activation = 0 and the anti-diagonal lower psum input = 0.</text><text x="560" y="353" class="mid s">The N x N staging bank preserves the public row format; it adds N squared weight words.</text></svg>