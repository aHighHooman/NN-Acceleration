<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" width="1120" height="430" role="img" aria-labelledby="f03-title f03-desc"><title id="f03-title">Row-buffered loading: collect every layer, write one PE row per clock, commit once</title><desc id="f03-desc">Host rows for all layers are collected into a staging buffer, layer 0 first and row N-1 first within each layer, with gaps allowed. The loader then picks one PE row per clock for LAYERS times N clocks; each write is registered and lands one edge later, so the last row lands on the single commit edge that raises weightsLoaded, after which inputs are accepted.</desc><style>
svg{--paper:#F3F5F3; --panel:#FFFFFF; --ink:#15191C; --ink-2:#48525A; --ink-3:#7A848B;
  --rule:#D5DBD8; --grid:#E5E9E6;
  --data:#2350C8; --data-soft:#DDE5FB; --learn:#CF4F16; --learn-soft:#FCE4D7;
  --store:#56665C; --store-soft:#E3EAE5; --ok:#2F7D4F; --warn:#B7791F;
  --display:"Arial Narrow","Roboto Condensed","Segoe UI",system-ui,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;}
@media (prefers-color-scheme:dark){svg{--paper:#101315; --panel:#171B1E; --ink:#E6E9EB; --ink-2:#AEB7BD; --ink-3:#7D878E;
    --rule:#2C3337; --grid:#20262A;
    --data:#86A6FF; --data-soft:#1B2847; --learn:#FF8F57; --learn-soft:#3A2116;
    --store:#A3B8AA; --store-soft:#1F2824; --ok:#63C28A; --warn:#E3B04B;}}
text{font-family:var(--body);fill:var(--ink);font-size:13px}
.m{font-family:var(--mono);font-size:12px}
.s{font-size:11.5px;fill:var(--ink-2)}
.ms{font-family:var(--mono);font-size:10.5px;fill:var(--ink-2)}
.b{font-weight:600}
.h{font-family:var(--display);font-weight:700;font-size:14px}
.mid{text-anchor:middle}
.end{text-anchor:end}
.muted{fill:var(--ink-3)}
.tdata{fill:var(--data)}
.tlearn{fill:var(--learn)}
.bx{fill:var(--panel);stroke:var(--ink);stroke-width:1.25}
.bx2{fill:var(--paper);stroke:var(--ink-3);stroke-width:1}
.bxd{fill:var(--data-soft);stroke:var(--data);stroke-width:1.25}
.bxl{fill:var(--learn-soft);stroke:var(--learn);stroke-width:1.5}
.bxs{fill:var(--store-soft);stroke:var(--store);stroke-width:1.25}
.frame{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:5 4}
.core{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}
.ld{fill:none;stroke:var(--data);stroke-width:2}
.ll{fill:none;stroke:var(--learn);stroke-width:2.25}
.ls{fill:none;stroke:var(--store);stroke-width:1.75}
.lk{fill:none;stroke:var(--ink-2);stroke-width:1.5}
.lg{fill:none;stroke:var(--grid);stroke-width:1}
.lr{fill:none;stroke:var(--rule);stroke-width:1}
.dash{stroke-dasharray:4 4}
.halo{fill:none;stroke:var(--panel);stroke-width:9}
.fd{fill:var(--data)} .fl{fill:var(--learn)} .fs{fill:var(--store)} .fk{fill:var(--ink-2)}
.fsoftd{fill:var(--data-soft)} .fsoftl{fill:var(--learn-soft)} .fsofts{fill:var(--store-soft)}
.fp{fill:var(--panel)} .fpp{fill:var(--paper)}
.ghost{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 2}
</style><rect x="1" y="1" width="1118" height="428" rx="10" style="fill:var(--panel);stroke:var(--rule)"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink-2)"/></marker></defs><text x="26" y="32" class="h">Row-buffered loading: collect every layer, write one PE row per clock, commit once</text><rect x="30" y="95" width="250" height="140" rx="6" class="bxs"/><text x="155.0" y="121" class="mid b">COLLECT</text><text x="155.0" y="143" class="mid s">LAYERS × N row handshakes</text><text x="155.0" y="165" class="mid s">Layer 0 first; row N−1 first</text><text x="155.0" y="187" class="mid s">Gaps allowed</text><path d="M280,165 L309,165" class="ls" marker-end="url(#arrow)"/><rect x="310" y="95" width="270" height="140" rx="6" class="bxs"/><text x="445.0" y="121" class="mid b">WRITE</text><text x="445.0" y="143" class="mid s">One PE row per clock</text><text x="445.0" y="165" class="mid s">cfg_we to layer l, row k</text><text x="445.0" y="187" class="mid s">LAYERS × N clocks, no shifting</text><path d="M580,165 L609,165" class="ls" marker-end="url(#arrow)"/><rect x="610" y="95" width="230" height="140" rx="6" class="bxs"/><text x="725.0" y="121" class="mid b">COMMIT</text><text x="725.0" y="143" class="mid s">One edge</text><text x="725.0" y="165" class="mid s">Last PE row lands</text><text x="725.0" y="187" class="mid s">weightsLoaded rises</text><path d="M840,165 L869,165" class="ls" marker-end="url(#arrow)"/><rect x="870" y="95" width="220" height="140" rx="6" class="bxd"/><text x="980.0" y="121" class="mid b">COMPUTE</text><text x="980.0" y="143" class="mid s">Inputs accepted</text><text x="980.0" y="165" class="mid s">Resident W stays put</text><text x="560" y="282" class="mid b">weightReady is low during WRITE and COMMIT; inputReady waits for weightsLoaded.</text><text x="560" y="317" class="mid s">On reload, the old resident weights stay in the PEs until WRITE starts; nothing computes meanwhile.</text><text x="560" y="347" class="mid s">The LAYERS × N × N staging buffer keeps the public row format. N=3, three layers: 9 rows, 9 writes, 1 commit.</text></svg>